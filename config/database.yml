# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# THREE databases in development, and the second and third are not optional.
#
#   queue  -- Solid Queue's tables. `bin/jobs` writes them constantly, and a
#             worker holding a write lock on the same file a request is reading
#             from is how a one-file SQLite app deadlocks itself.
#   cable  -- Solid Cable's. A turn is broadcast from the `bin/jobs` process and
#             read by a WebSocket held in Puma, so the two processes have to
#             share a pub/sub substrate. `adapter: async` is per-process, so
#             with it the prose is broadcast into the worker and nobody ever
#             sees it -- which is exactly what happened the first time this was
#             walked in a browser. See config/cable.yml.
#
# `bin/rails db:prepare` creates all three: a non-primary config named `x` is
# loaded from `db/x_schema.rb` by default, which is where `queue_schema.rb` and
# `cable_schema.rb` have been sitting unused.
development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
