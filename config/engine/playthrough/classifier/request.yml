# Read by Playthrough::Classifier::Request through EngineData (app/models/engine_data.rb), which
# declares this file's shape. Why each value says what it says is in the
# header of Playthrough::Classifier::Request, beside the constant that names it. Every byte here is
# sent or rolled: an edit is a prompt change and needs a baseline (AGENTS.md).
---
intent_instructions: Which single intent is the player requesting in `player_action`? Keep the requested intent even when its target is absent from the corresponding state list.
intent_criteria:
  move: The player is trying to go somewhere else or cross a doorway, whether or not the destination is listed in `ways_out`.
  talk: The player is speaking to or asking somebody; threats without physical contact and asking for somebody's item are talk.
  examine: The player is looking at, inspecting, or reading something more closely without moving or taking it, or looking around the place in general.
  take: The player is trying to pick something up from where they are, whether or not it is listed in `available_items`.
  drop: The player is trying to put down, leave behind, or give up something they carry, whether or not it is listed in `player_items`.
  attack: The player is trying to physically hurt somebody; a spoken threat without contact is talk.
  use: The player is trying to consume or burn an item, offer a carried item, or open a barrier.
  other: The line requests none of the other listed actions, such as waiting, reflecting, or making an unrelated observation.
target_instructions: Which single listed record are they aiming that at? Match direct names, listed aliases, ordinary shortened references, direct address, and an unambiguous pronoun when context identifies one record. When the line names several fitting records, or covers them with a collective word (`everything`, `all of it`, `the lot`, `them`, `both`, `each`) or an `and then` continuation, answer with one of them, never `%{nothing}`; `also_named` handles another. Choose `%{nothing}` only when the record they are asking for is absent from this list. Never substitute a merely related record for an absent one. Answer this question on its own; do not decide whether this is what the player is actually doing.
targets:
  move:
    premise: crossing a doorway to another location
    nothing: No listed way out is the one being crossed, or the requested destination is absent.
  talk:
    premise: speaking to or asking somebody
    nothing: No listed person is the one being spoken to, or the requested person is absent.
  attack:
    premise: physically hurting somebody
    nothing: No listed person is the one being struck, or the requested person is absent.
  take:
    premise: picking something up from where they are
    nothing: Nothing listed here is the thing being picked up, or the requested thing is absent.
  drop:
    premise: putting down, leaving behind or giving up something they carry
    nothing: Nothing carried is the thing being put down, or the requested thing is absent.
  examine:
    premise: looking at, inspecting or reading something more closely
    nothing: Nothing listed here or carried is the thing being looked at, or the requested thing is absent.
  use:
    premise: consuming or burning an item, offering a carried item, or opening a barrier
    nothing: No listed attempt matches the request in action, object, recipient and tool.
also_named_instructions: Independently inspect `player_action` and the state. Does the same requested intent explicitly name or unambiguously include at least two distinct records from that intent's appropriate state list? If so, choose one listed record distinct from the likely main target; for an ordinary two-record request, choose the other record rather than `%{nothing}`. Words such as `both`, `all`, `everything`, `all of it`, `the lot`, `them`, or `each`, and a second record added with `and then`, include every fitting record in the corresponding list; the main target takes one of them and you name another. Choose `%{nothing}` when fewer than two fitting records are requested. Objects, tools, and recipients already bound inside one complete `physical_actions` attempt are not a second act.
also_named_nothing: No appropriate listed record is named, or the requested target is absent from the appropriate list.
named_more_than_one_instructions: 'First identify the one requested intent. Return a high yes probability only when that same intent requests at least two distinct eligible records: move counts `ways_out`; talk or attack counts `other_characters`; take counts `available_items`; drop counts `player_items`; examine counts either item list. A talk command that directly names two present people counts both even when one is addressed and the other appears inside the requested message. A record listed only for a different intent does not count. If the intent is `other`, the answer is no. Collective words such as `both`, `all`, `everything`, `the lot`, or `them` count only when context unambiguously selects at least two eligible records. A single `physical_actions` attempt is one act even when it binds several parts.'
named_more_than_one_criteria:
  'true': The same non-other requested intent explicitly names or unambiguously includes at least two distinct records from its eligible state list.
  'false': The line has at most one eligible listed record for its requested intent, refers only to absent or differently eligible records, is other, or names parts already bound inside one complete physical action.
target_present_instructions: 'Does the state actually list the thing or person `player_action` asks for? Answer yes when a listed record IS that thing - by name, by a listed alias, by an ordinary shortened reference, by direct address, or by an unambiguous pronoun - and yes when a collective word such as `everything`, `all of it`, `the lot`, `them`, `both` or `each` covers listed records. Answer no when the line asks for something the state does not list and only similar or related records are present: the rest of a group whose other members are absent, a role or relationship nobody listed holds, or a thing held inside, made by or stored in a listed record. Judge only what is asked for against what is listed; do not decide which action it is.'
target_present_criteria:
  'true': A listed record is the very thing or person the line asks for, or a collective word covers listed records.
  'false': What the line asks for is absent from the state and only similar, containing or related records are listed.
