- id: branch-geometry-stairs
  story: The Quay House
  room: The Custom House room 1
  reached_from: The Quay
  expects_new_ground: false
  shape: interior-room
  staging:
    population: nobody
  why: >-
    The exported engine plan supplies an east-wall door, a stair with a bearing
    to the upper floor, and an exterior way out. Full request identity detects
    their wording. Wall-specific door prose remains the geometry lab's judgement.

- id: branch-restored-conversation
  story: The Quay House
  room: The Quay
  expects_new_ground: true
  shape: restored-conversation
