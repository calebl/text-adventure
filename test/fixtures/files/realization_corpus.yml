- id: branch-saturated-items
  story: The Quay House
  room: The Custom House room 1
  reached_from: The Quay
  expects_new_ground: false
  shape: interior-room
  staging:
    saturated_items: true
  why: >-
    World templates already fill the room allowance. The fallback instruction
