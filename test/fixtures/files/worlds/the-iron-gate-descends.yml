# The Iron Gate Descends -- a GENERATED world, frozen as a bench fixture.
#
# NOT A SEEDED WORLD. It is deliberately not under `db/seeds/worlds`, because
# everything there is loaded into every development database, into every fresh
# clone and into `Eval::Base`'s base world -- so putting it there would add a
# fourth world to every sweep and every doctor run as a side effect of building
# an instrument. `Eval::Realization::WORLD_ROOTS` reads this directory second,
# and `rake eval:realization` is its only reader.
#
# WHY A GENERATED WORLD IS IN THE CORPUS AT ALL. The defect the realization
# bench was built to measure was measured HERE: 36% of this world's exits named
# a place the story already had, and its deepest room -- Blackfang Tunnel --
# wrote its ways out and every one of them led back up
# (`data/ta-quest-progress-scout/report.md` D5). A corpus of nothing but
# hand-authored seeds would be a corpus of worlds a person wrote the neighbours
# of, which is not the world a player generates.
#
# Exported out of the captain's own database with `rake 'game:export[7]'` on
# 2026-09-06 and unedited since. It is a MEASUREMENT INPUT: an agent improving
# the game changes none of it, and `Eval::MEASUREMENT_FILES` says so.
---
format: 2
universe:
  physics: |-
    Gravity is consistent at 9.8 m/s², but the world is veined with ley lines—thin, invisible rivers of latent magic that pulse at a frequency of 0.3 Hz, detectable only by iron-forged compasses. These lines can be tapped by blood rituals, but each use drains the caster’s lifespan by exactly one day per minute of magic. The ley lines are finite; overuse in a region causes them to fade for a century. No magic can resurrect the dead or heal mortal wounds, only delay them.
  technology: |-
    The world is locked in a late medieval stasis, with iron and steel as the primary metals. Clockwork mechanisms exist but are rare, limited to devices no larger than a loaf of bread due to the scarcity of precision gears. Gunpowder is known but unstable, often exploding prematurely in 1 out of 5 attempts. Most advancements are suppressed by the Church of the Eternal Pyre, which burns any invention deemed heretical.
  weapons: |-
    Swords, axes, and maces dominate, with the knightly class wielding blades of cold-forged Veldarian steel, which never rusts but shatters if struck by goblin-wrought obsidian. Goblins favor curved daggers coated in paralyzing venom, effective only if the wound draws blood. Crossbows are used by mercenaries but require 30 seconds to reload, making them impractical in close quarters. No ranged weapon can pierce the hide of a cave troll, which guards the dungeon’s depths.
  geographies: |-
    The kingdom of Durnhold is a land of jagged iron cliffs and black pine forests, its heart dominated by the Ashen Spire, a dead volcano where the Church burns heretics. The goblin caves lie beneath the Spire’s roots, a labyrinth of obsidian tunnels lit by bioluminescent fungi that dim every 12 hours. The nearest town, Hollow’s End, is a day’s ride north, its walls built from the bones of ancient trolls. The river Veyth, wide and slow, marks the border between Durnhold and the goblin territories, its waters undrinkable due to high iron content.
  civilizations: |-
    The Kingdom of Durnhold is ruled by the Iron Council, a cabal of knights and priests who enforce the Church’s decrees from the Obsidian Throne in the capital, Spire’s Rest. The goblins are divided into warring clans, the largest being the Blackfang, who control the dungeon where the prince is held. The Trollkin have no settlements, only nomadic bands, while the Veythi operate from floating barges on the river, their only permanent structure being the Rust Market, a black-market hub hidden in the river’s mist. The uneasy peace is maintained by the Iron Council’s threat of annihilation and the goblins’ fear of open war, but raids and executions are common.
  history: |-
    A century ago, the Durnish waged the War of the Spire, driving the goblins underground and sealing the caves with iron gates. The Church then burned the last great library of the Veythi, accusing them of heresy, which forced the river-dwellers into secrecy. Twenty years past, the Iron Council executed the last Trollkin king, scattering his people. Now, the prince’s capture by the Blackfang clan has shattered the fragile truce, as the Council debates whether to negotiate or burn the caves to the ground.
  economics: |-
    Durnhold’s wealth comes from iron and coal, mined by convicts in the Spire’s shadow. The Church taxes all trade, taking a third of all goods in the name of the Eternal Pyre. Goblins trade in stolen Durnish steel and rare fungi, which they sell to the Veythi for clockwork parts. The Veythi deal in information and forbidden tech, but their currency is blood—each transaction requires a drop from the buyer, stored in vials as proof of the exchange. Trollkin have no economy, surviving by hunting and scavenging.
  politics: |-
    The Iron Council holds power through fear, their knights enforcing the Church’s will with fire and steel. The Blackfang goblins are the only clan bold enough to defy them, using the prince as leverage to demand the return of their sacred obsidian, stolen during the War of the Spire. The Veythi play both sides, selling secrets to the Council while smuggling weapons to the goblins. The Trollkin are caught in the middle, hunted by the Church but too few in number to resist. The prince’s rescue could tip the balance—if he lives, the Council may strike; if he dies, the goblins will have nothing to lose.
  religion: |-
    The Church of the Eternal Pyre preaches that the world is a forge, and all life must be tempered by suffering to be made pure. They believe the ley lines are the veins of a sleeping god, and that magic is theft from the divine. The goblins worship the Silent Maw, a god who demands blood and silence, believing that all noise is a lie. The Veythi have no gods, only the River, which they see as a force of change and decay. The Trollkin revere the First Maw, a primordial troll said to have birthed their race, but their rituals are secret, performed only in the dark.
  races:
  - name: Durnish
    description: |-
      Humans of the kingdom of Durnhold, tall and broad-shouldered with ashen skin from generations of iron-smoke. They revere the Church of the Eternal Pyre, whose priests brand heretics with white-hot irons. Their knights wear blackened plate armor, forged from Veldarian steel, but it is heavy—no Durnish warrior can run for more than a minute in full gear.
  - name: Goblins
    description: |-
      Squat, green-skinned humanoids with elongated fingers and needle teeth, dwelling in the obsidian caves beneath the Ashen Spire. They worship the Silent Maw, a god of hunger, and believe all surface-dwellers are already dead. Their venomous daggers are their only advantage; without them, they are weak in direct combat.
  - name: Trollkin
    description: |-
      Hulking, gray-furred descendants of cave trolls, standing twice the height of a Durnish knight. They are immune to poison and can regenerate wounds, but only if they consume raw meat within an hour of injury. The Church hunts them as abominations, though they keep to the riverbanks and rarely attack unless provoked.
  - name: Veythi
    description: |-
      Pale, gaunt humans who live along the iron-tainted River Veyth, their skin stained rust-red from the water. They trade in forbidden knowledge, smuggling clockwork devices and alchemical texts to the highest bidder. The Church executes them on sight, but the goblins tolerate them as suppliers of surface-world goods.
story:
  title: The Iron Gate Descends
  genre: dark fantasy
  start_time: '2026-09-05T20:17:00Z'
  preface: |-
    The iron gate groans as it settles into the stone, its teeth biting into the threshold with a finality that echoes through the cavern. You stand in the dim glow of bioluminescent fungi, the air thick with the scent of damp earth and old blood. Your gauntleted hand rests on the hilt of your Veldarian sword, its edge still sharp despite the weight of the blackened plate armor pressing into your shoulders. The prince’s signet ring, cold in your palm, was found in the mud outside this gate—proof he passed this way. Behind you, the tunnel slopes upward, but the way forward is a yawning maw of obsidian, the walls slick with moisture. Somewhere in the dark, something skitters.
  summary: |-
    A Durnish knight, clad in heavy blackened plate, stands at the threshold of the goblin caves beneath the Ashen Spire, having just forced open an iron gate. The prince’s signet ring, discovered in the mud, confirms his passage into the tunnels. The air is thick with the scent of damp earth and the faint glow of fungi, while the distant sound of movement hints at unseen dangers ahead. The Church’s decree to retrieve the prince or die trying weighs heavily, but the immediate threat is the darkness itself.
opening_scene:
  location: Iron Gate Chamber
  characters: []
  description: |-
    The first thing that hits you is the stench of wet iron and old blood, thick enough to coat your throat. Then comes the cold—damp, seeping through the seams of your armor as your boot crunches on something brittle in the mud. The air hums faintly, a vibration in your teeth, and the dim glow of the fungi pulses like a slow, dying heartbeat against the black stone. The gate’s jagged teeth yawn behind you, but the tunnel ahead swallows the light whole, leaving only the sound of something shifting in the dark.
  summary: |-
    The player steps into the Iron Gate Chamber, encountering the sensory overload of the cavern’s atmosphere and the immediate presence of the tunnel ahead.
characters:
- fullname: Veythra the Silent
  race: Trollkin
  stats:
    level: 1
    hit_die: 8
    strength: 13
    dexterity: 7
    will: 10
  nickname: The River’s Shadow
  age: 107
  sex: female
  is_protagonist: true
  is_companion: false
  backstory: |-
    Veythra was born on a Veythi barge, the only Trollkin child among river traders who saw her as an omen. Raised by an exiled Durnish knight turned mentor, she learned the ways of the wild and the weight of secrets. The Church’s hunts forced her into hiding, but she never forgot the debt she owed to the river for sparing her life. Now, she wanders the banks of the Veyth, tracking the movements of the Blackfang goblins, driven by a quiet vow to protect the last of her kind. The prince’s capture has drawn her attention, as the goblins’ boldness threatens the fragile balance she has spent a lifetime maintaining. She seeks not glory, but survival—for herself and the scattered remnants of the Trollkin.
  personality: |-
    Veythra is reserved and deliberate, speaking only when necessary and often in riddles. She carries a quiet intensity, observing the world with a hunter’s patience, though she treats others with a cautious respect born of survival. Her loyalty is rare but absolute once given.
  appearance: |-
    Towering over most, Veythra’s gray fur is streaked with silver, a sign of her age, and her broad frame is draped in a tattered cloak woven from river reeds. Her tusks are filed to points, and her amber eyes glow faintly in the dark, a trait of her lineage. Scars crisscross her arms, each a story she refuses to tell.
  likes: |-
    raw fish, the sound of flowing water, the scent of rain on stone, the weight of a well-balanced axe, solitude
  dislikes: |-
    fire, the Church’s hymns, the taste of cooked meat, being watched, iron chains
  fears: |-
    being trapped underground, the Church’s pyres, losing her sense of smell, the Silent Maw’s hunger
locations:
- name: Iron Gate Chamber
  detail_level: realized
  opening: true
  teaser: |-
    A cavernous entryway where the last iron gate of Durnhold’s defense has just been forced open, its teeth embedded in the stone floor.
  description: |-
    The iron gate lies half-buried in the stone floor, its jagged teeth glinting dully in the pale glow of bioluminescent fungi clinging to the cavern walls. The air is thick with the scent of damp earth and rust, the taste of iron sharp on your tongue. The tunnel ahead yawns black and slick with moisture, the faint sound of skittering claws echoing from its depths. Your boot sinks slightly into the muddy threshold, where a single, deep groove cuts across the stone—fresh, as if something heavy was dragged through. The dim light flickers, casting long, wavering shadows that seem to crawl along the obsidian walls.
  lore: |-
    This chamber marks the final Durnish outpost before the goblin tunnels, a last line of defense built into the roots of the Ashen Spire. The gate was forged by the Iron Council to seal the caves after the Blackfang raids grew bolder, its mechanism designed to lock from the outside. The groove in the stone is new, likely made by the prince’s captors as they hauled him deeper into the labyrinth. The fungi here pulse faintly in time with the ley lines, though their glow is too weak to reveal what lurks beyond. The Church’s decree to retrieve the prince has driven many knights this far, but few return.
  items:
  - name: iron key
    description: |-
      A small, rusted key lying near the gate’s hinge, its bow shaped like a serpent’s head. It looks too delicate to have opened this gate.
    properties:
  - name: prince's signet ring
    description: |-
      A heavy gold ring, its surface etched with the royal crest of Durnhold, still caked with mud. The metal is cold and slightly bent, as if wrenched from a finger.
    properties:
- name: tunnel upward
  detail_level: realized
  teaser: |-
    The sloping passage back toward the surface, where the faintest glimmer of torchlight hints at the world above.
  description: |-
    The tunnel slopes upward, its rough-hewn walls slick with moisture and streaked with veins of iron ore. You feel the faintest draft of cooler air from above, carrying the scent of torch smoke and damp stone. The bioluminescent fungi here are sparse, their dim glow barely illuminating the uneven footing under your boots. The ceiling presses low in places, forcing you to duck as you ascend. Somewhere ahead, a distant flicker of torchlight hints at the world beyond the caves.
  lore: |-
    This passage was carved by goblin labor under the lash of Durnish overseers, a forced route to the surface for the Blackfang clan’s tribute and prisoners. The iron veins in the stone were once mined, but the seams played out decades ago, leaving only the damp, echoing tunnel. The Church occasionally uses it to drag heretics down to the Spire’s roots, though most never return. The torchlight above belongs to the watch posted at the cave’s mouth, a reminder of the world you left behind.
- name: obsidian maw
  detail_level: realized
  teaser: |-
    The yawning black tunnel ahead, its walls slick with moisture and the distant sound of skittering claws echoing from the dark.
  description: |-
    You stand at the mouth of a tunnel carved from black obsidian, its walls glistening with moisture that drips in slow, uneven rhythms. The air is thick with the scent of damp stone and something metallic, like old blood. Faint blue-green fungi cling to the ceiling, casting a sickly glow that barely reaches the slick, uneven floor. From the depths, the sound of skittering claws echoes, sharp and deliberate, as if something is testing the edges of the dark. The cold seeps through your armor, and the silence between the sounds feels heavier than the stone itself.
  lore: |-
    This tunnel is part of the Blackfang goblin clan’s labyrinth beneath the Ashen Spire, a network of passages hewn from the volcano’s ancient roots. The obsidian here was formed by a long-dead eruption, its surface polished smooth by centuries of water and the passage of countless goblin feet. The fungi are a symbiotic growth, fed by the iron-rich waters seeping from the stone, and their dim light is all that keeps the tunnels from absolute darkness. The skittering is likely a goblin scout or a cave-dwelling predator, both drawn to the scent of intruders. The Church’s inquisitors have long suspected these tunnels lead to the prince’s prison, but none have returned to confirm it.
  items:
  - name: damp scroll
    description: |-
      A rolled parchment, its edges frayed and its surface stained with moisture. The ink is smudged but still legible in places.
    readable: true
    inscription: Beware the teeth of the dark. They hunger.
    properties:
  - name: iron shard
    description: |-
      A jagged fragment of blackened metal, its edges sharp and its surface pitted with age. It looks like it was broken from something larger, perhaps a blade or a tool.
    properties:
- name: Blackfang Tunnel
  detail_level: realized
  teaser: |-
    The obsidian passage slopes downward, the skittering sounds growing louder as the light fades.
  description: |-
    The obsidian walls of the tunnel glisten with moisture, their jagged edges catching the dim glow of bioluminescent fungi clinging to the ceiling. The air is thick with the scent of damp earth and something metallic, like old blood. The passage slopes downward, the floor uneven and slick underfoot, and the skittering sounds echo from deeper within the dark, growing louder as you listen. The faint pulse of a ley line hums beneath your boots, detectable only by the faintest vibration in the iron of your armor. A cold draft curls around your ankles, carrying the musk of wet stone and something faintly rotten.
  lore: |-
    This tunnel is part of the Blackfang clan’s network beneath the Ashen Spire, carved by goblin hands over centuries into the obsidian veins of the dead volcano. The ley line here is weak but active, often used by goblin shamans for minor rituals, though its proximity to the surface has left it nearly spent. The skittering sounds are likely cave rats or worse—goblin sentries, or something that has made its home in the dark. The dampness never fully dries, and the fungi thrive in the absence of sunlight.
  items:
  - name: rusted dagger
    description: |-
      A small, pitted blade of cheap iron, its edge dulled by time and neglect. The hilt is wrapped in frayed leather, still damp to the touch.
    properties:
  - name: tattered cloth
    description: |-
      A strip of coarse, once-red fabric, now faded and stained with something dark. It smells faintly of sweat and iron.
    properties:
- name: surface
  detail_level: realized
  danger: dangerous
  teaser: |-
    The mouth of the cave opens to the ashen slopes of the Spire, where the wind carries the scent of burning pitch.
  description: |-
    You stand on the ashen slope of the Spire, the wind biting at your exposed skin as it carries the acrid tang of burning pitch from the distant pyres. The cave mouth yawns behind you, its darkness a stark contrast to the pale, powdery ground underfoot. The air is dry here, the heat of the sun baking the iron-rich earth into a brittle crust that cracks beneath your boots. To the north, the black pines of Durnhold stretch like skeletal fingers, while the river Veyth glints far below, its surface a dull, rusted mirror. The only sound is the whisper of the wind and the occasional groan of the Spire’s iron cliffs shifting in the heat.
  lore: |-
    This is the surface entrance to the goblin caves, a jagged scar in the Ashen Spire’s flank where the earth has been worn away by centuries of wind and water. The Church’s heretic burnings have left the air thick with the scent of charred flesh and pitch, and the iron-rich soil here is barren, unable to sustain life beyond the hardy black pines. The cave itself was once a natural fissure, but goblin hands have widened it over generations, carving a path into the depths below. The Spire’s slopes are treacherous, littered with loose rock and the occasional bone of some unfortunate who misjudged their footing.
  items:
  - name: charred bone
    description: |-
      A blackened fragment of bone, likely from an animal, its surface cracked and brittle from the heat of the pyres. It’s light enough to carry but offers no immediate use.
    properties:
  - name: iron flake
    description: |-
      A thin, rusted shard of iron, no larger than a palm, broken off from the Spire’s cliffs. It’s sharp on one edge but too small to be a weapon.
    properties:
