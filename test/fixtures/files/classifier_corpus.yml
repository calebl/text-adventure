- id: grammar-and-nothing-else
  position: closet
  typed: take the apron and nothing else
  intent: take
  target: copy-room apron
  refusal: none
  shape: two-sets
  why: >-
    THE WORD `nothing` TYPED BY THE PLAYER, and it is the enum's own answer for
    "named nothing". `also_named` must come back `nothing` because that is what
    the line SAYS, and the index on the same floor must not land in it. The
    trickiest one-act line in the corpus

- id: grammar-repeat
  position: office
  typed: again
  intent: other
  shape: other
  why: >-
    A LINE THAT REFERS TO THE LAST TURN, which the classifier is not told about
