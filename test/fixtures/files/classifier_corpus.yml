# ===========================================================================
# THE LINES THE `rake eval:run` SCRIPTS PLAY
#
# Sixty turns across three worlds, written by hand and played by every sweep.
# They are already the app's most-exercised input, and until now nothing checked
# that the classifier read them the way the script's own `expect:` says. A
# script turn that lands on the wrong branch is reported by `Eval::Board` as
# script divergence -- a fact about the harness -- and this is where the same
# fact becomes a fact about the classifier.
# ===========================================================================
