# THE CLASSIFIER CORPUS: typed lines with the answer written beside them.
#
# WHAT IT IS FOR. `Playthrough::Classifier` is the only model call in this app
# whose answer the engine ACTS on, it runs on every turn, and until 2026-09-04
# nothing measured whether it was right. `Playthrough::Drift` and
# `Playthrough::Overreach` count its misses INDIRECTLY and neither knows the
# answer: a drift row is written whether the player reached for a door that is
# not there or the model failed to see a door that is. Since the ruling of
# 2026-09-04 that gap costs the player a refusal they can read, so it is worth
# an instrument. `Eval::Classifier` is the instrument and this is its corpus.
#
# HOW A LINE IS LABELLED, and how the label is verified. Every line names a
# POSITION -- a seeded world, a room, and the typed lines that get to the state
# the label was written against -- because a classifier answer is only
# meaningful next to the closed sets the model was offered. `take the apron`
# resolves to a record in the supply closet and to nothing in the office.
#
#   1. THE CLOSED SETS ARE READ OFF THE RECORDS, not off the seed file, and
#      printed. Every `target` and `also_named` in this file was written against
#      that printout.
#   2. `Eval::Classifier::Corpus#problems` CHECKS EVERY NAME back against the
#      set the action really reads (`Playthrough::Classifier#offered_for`), and
#      `Eval::Classifier::CorpusTest` fails the build if one does not fit. A
#      label naming a thing that is not in reach cannot survive a commit.
#   3. `refusal:` IS REDUNDANT ON PURPOSE. The three kinds are derivable from
#      intent, target and `also_named` through the same predicates
#      `Playthrough::Classifier::Intent#refused?` uses, and the validator
#      derives them and compares. Two readings of one line have to agree, and a
#      disagreement is a failing test rather than a number nobody checked.
#   4. WHAT NEITHER CAN CHECK is whether the label is the right reading of the
#      English. That is the hand-verification, and every line carries a `why`
#      saying what it is here to measure. A line whose English genuinely admits
#      two readings carries `also_accept`, and the board reports how many there
#      are -- a bench that marked a defensible answer wrong would be measuring
#      its own labelling.
#
# WHERE THE LINES CAME FROM. Three sources, and none of them invented whole:
#
#   * the 61 stored classifier conversations in the captain's own database
#     (`chats.purpose = "classifier"`, kept since PR 97) -- what a person really
#     typed, with the room and the closed sets the model was really shown;
#   * the 20-turn `rake eval:run` scripts and the `rake game:sweep` scripts,
#     which are the lines two instruments already play;
#   * the shapes the ruling of 2026-09-04 made load-bearing and nothing yet
#     types: two names out of one closed set, two names across two sets, an
#     `examine` that landed on nothing, an `other` that must NOT be refused.
#
# A line lifted from a real conversation is played against the position whose
# closed sets match the ones it was really shown; where no seeded position
# matches, the line is rewritten against a position that does and `why` says so.
#
# WHAT IS DELIBERATELY NOT IN HERE:
#
#   * `unreadable`. It is an `intent` outside `Playthrough::IntentSchema::INTENTS`
#     answered by a provider that ignored a closed enum, so it cannot be
#     provoked by a typed line at all. `Playthrough::RefusalTest` and
#     `Playthrough::TurnTest` pin it from the other side.
#   * mismatched-gender pronouns and other trick questions. The bench measures
#     the readings a player types, not the ones a labeller can argue about.
#
# EDITING THIS FILE: add a line under the shape it belongs to, give it a `why`,
# and run `bin/rails test test/lib/eval/classifier_corpus_test.rb`. If the shape
# you need is not reachable from any position here, add a position rather than
# stretching an existing label.
---
