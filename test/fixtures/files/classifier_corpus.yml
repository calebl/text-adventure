# ===========================================================================
# THE GAP PR 112 PINNED: TWO ACTS ACROSS TWO CLOSED SETS
#
# `#also_named` resolves the second name through the ACTION'S OWN closed set,
# because a second and looser way into the records is what a closed set exists
# to prevent. So "take the ward stamp and the daybook" -- one on the floor, one
# in the hands -- names two things a player would call two acts, and only one of
# them is in the set a `take` reads. The line is PLAYED, not refused, and
# `lib/engine_sweep/scripts/one-act-per-line.yml` pins it as a gap so that
# closing it is a deliberate act.
#
# These lines are labelled as the app answers them: one act, `also_named`
# nothing, no refusal. If they start failing, the gap was closed on purpose and
# `one-act-per-line.yml`'s header is the thing to read first.
# ===========================================================================
