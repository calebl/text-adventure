- id: grammar-double-negative
  position: office
  typed: do not take the stamp
  intent: other
  shape: other
  why: >-
    A NEGATED COMMAND, which contains an exact enum entry and asks for the
    opposite of the act. `take` / "ward stamp" would move a row the player asked
    not to move -- the most costly single misreading in this corpus, and the
    label is deliberately STRICT: nothing about "do not take" accepts a `take`

