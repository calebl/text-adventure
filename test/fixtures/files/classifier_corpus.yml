# ===========================================================================
# ONE ACT: A TALK THAT RESOLVES
#
# `talk` picks which character prompt `InteractionAgent` builds, so a wrong
# speaker is a conversation with the wrong person. The closed set is
# `Character.present_in` plus the party, and it holds BOTH a fullname and a
# nickname for everybody -- so a line naming either one has to resolve, and to
# the same record. That is the fix of PR 102 and it is measured here.
# ===========================================================================
- id: talk-rowe-fullname
  position: office
  typed: talk to Halkett Rowe
  intent: talk
  target: Halkett Rowe
  shape: talk
  why: the fullname, plainly -- the floor case

