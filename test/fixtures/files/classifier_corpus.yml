  typed: talk to Sub-Inspector Rowe
  intent: talk
  target: Halkett Rowe
  shape: talk
  why: >-
    THE NICKNAME RESOLVES TO THE SAME RECORD. Both names are in the enum
    (`Playthrough::Classifier#cast_names`), and the arrival prose calls him this
    one, so this is the name a player has actually been shown

