# ===========================================================================
# ARTICLES, PRONOUNS AND THE THINGS A FIXED GRAMMAR CHOKES ON
#
# `Playthrough::Mechanics#resolve` has `LEADING_WORDS`, prefix matching, fragment
# matching in both directions and an ambiguity rule, and its own header says why:
# "the player is not a JSON enum". Every one of those rules was added because a
# real line was refused. A classifier call is bought instead of that grammar, so
# what it is bought FOR is worth measuring on its own -- these are the lines the
# grammar gets wrong or cannot see, and the offline floor
# (`rake eval:classifier_offline`) prints exactly how many.
# ===========================================================================
