mechanics:
- name: The nightly rearrangement
  kind: shuffle_connections
  cadence: nightly
  description: |-
    At midnight Nocturna floods the city and the Larkspur Quarter travels. The boarding house, its hallway, the lane below it and the rooftops above it go as one piece with their own doors intact -- old Grenn laid his foundation stones loose for exactly this -- and come to rest against a different part of Nocturnis. The fixed ground does not move: the Celestial Spire, the Sovereign's Circle and the bell tower of Saint Aravel are where they have always been. What changes is which of them you can walk to from here, and a map of last night is a map of nowhere.
