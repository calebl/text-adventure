# The Lunar Cartographer -- a seeded, playable world.
#
# Exported from a generated world with `rake 'game:export[1]'`, then edited by
# hand: this file is the authored artifact, not a dump. What was changed after
# export -- the three connections came from before DISTANCES and TRAVEL_METHODS
# were fixed tables and had free prose in them, three fields were cut off
# mid-sentence by the generator's length caps, and the story had no characters
# because Story::Generator does not make any.
#
# The opening_scene was written by hand too. `rake game:new` narrates one now,
# but this world predates that, and its cast is the point: Grenn is in the room
# from the first line, so there is somebody to talk to on turn one.
#
# The `mechanics` block and everything it needs were hand-written as well: the
# `mobile: true` flags on the four Larkspur Quarter locations, the three fixed
# landmarks the universe's own prose already names -- the Celestial Spire, the
# Sovereign's Circle, the bell tower of Saint Aravel -- and the three
# connections out of the quarter that reach them. This world's physics have
# claimed since it was generated that Nocturnis rearranges itself every night;
# the mechanic is that claim made true in the records rather than in prose.
# THE ONE SEEDED WORLD WITH A MONSTER IN IT, and it is here rather than in the
# other two on purpose. `The Salt Assizes` is the held-out world for
# `rake eval:run` and nothing tunes against it; `The Unrecorded Hour`'s own
# universe says physical violence is rarely the instrument of choice, and a
# bureaucratic mystery is the wrong world to put a thing with hands in. This
# one's physics have claimed since it was generated that prolonged exposure to
# Nocturna causes disorientation and memory loss, so `Nocturna-Blighted` is that
# claim followed to its end and made a `monstrous: true` race, and Marek Sollen
# in the bell chamber is one of them. The Bell of Saint Aravel is realized for
# the same reason the supply closet in `The Unrecorded Hour` is: a stub has
# nothing in it to walk into, and there has to be somewhere to meet him.
# Nothing fights yet -- see `lib/engine_sweep/scripts/a-monster-in-a-room.yml`,
# which walks up to him and asserts that the records say what he is.
#
# See db/seeds/worlds/README.md for the format and the rules the loader checks.
#
# Loaded offline by db/seeds.rb. No model call, no API key, no network.
---
format: 2
universe:
  physics: |-
    This world adheres to standard physical laws, with one exception: the city of Nocturnis, built on the ruins of an ancient war, rearranges itself every night due to the residual magical energy from the Great War. This energy, called Nocturna, is harnessed from the moon and causes buildings, streets, and landmarks to shift and change. The effects of Nocturna are limited to the city boundaries, and its influence wanes during the day, allowing the city to remain static until nightfall. Nocturna does not affect living beings directly, but prolonged exposure can cause disorientation and memory loss. The city's rearrangement follows certain patterns, often influenced by the phases of the moon, but these patterns are complex and not fully understood.
  technology: |-
    Technology in this world is a blend of pre-war remnants and post-war innovations. The Great War, which ended 75 years ago, left behind advanced but often broken or dangerous technology. The current society has managed to salvage and repurpose some of this tech, but much of it remains beyond their understanding. Most people rely on steam-powered machinery and simple electronics. The city of Nocturnis has a unique technology called Lunar Compasses, which are devices that can predict the city's nightly rearrangements with about 60% accuracy. These compasses are highly sought after but require rare moonstones to function.
  weapons: |-
    Weapons in this world are a mix of traditional and advanced. Most common are steam-powered firearms, which require a special type of ammunition infused with a small amount of Nocturna to function. Swords and other melee weapons are also common, often made from salvaged pre-war materials. The most feared weapons are the remnants of the Great War, such as the Arcane Cannons, which can harness Nocturna to devastating effect. However, these weapons are rare and closely guarded by the city's ruling council, the Lunar Sovereigns. Carrying weapons within the city limits is legal but regulated, and only licensed individuals can carry firearms.
  geographies: |-
    The world is dominated by the ever-changing city of Nocturnis, surrounded by a vast, desolate landscape known as the Scorch. The Scorch is a reminder of the Great War, a wasteland where little life thrives. To the north lies the Crystal Peaks, a mountain range rich in moonstones. To the east, the Verdant Expanse is a vast forest that has begun to reclaim the land. Within Nocturnis, notable landmarks include the Ever-Shifting Bazaar, a marketplace that changes location and layout every night, and the Celestial Spire, a tower that remains static despite the city's rearrangements. The city is divided into districts, each with its unique characteristics, such as the Industrial Quarter, the Residential Loop, and the Sovereign's Circle.
  civilizations: |-
    The city of Nocturnis is the center of civilization, ruled by the Lunar Sovereigns who control the supply of moonstones and advanced technology. The Sovereigns live in the opulent Sovereign's Circle, while the rest of the population resides in the ever-changing districts. The Scorch Nomads roam the wasteland, trading scavenged pre-war technology and resources with the Verdant Folk and Crystal Dwarves. The Verdant Folk live in harmony with nature in the Verdant Expanse, while the Crystal Dwarves mine moonstones in the Crystal Peaks. Tensions exist between the Lunar Sovereigns and the other factions due to the Sovereigns' control of resources and technology, as well as their secretive and hierarchical nature.
  history: |-
    The Great War, which ended 75 years ago, was a cataclysmic event that reshaped the world. It was fought between the ancient precursors to the Lunar Sovereigns and an alliance of other races over control of Nocturna and advanced technology. The war resulted in the devastation of the landscape, now known as the Scorch, and the creation of the ever-changing city of Nocturnis. In the aftermath, the Lunar Sovereigns seized control of the city and its resources, leading to the current societal structure and tensions.
  economics: |-
    The economy of this world revolves around the trade of moonstones, technology, and resources. The Lunar Sovereigns control the supply of moonstones, which are essential for powering advanced technology and Lunar Compasses. The Crystal Dwarves mine these moonstones and trade them for resources with the other factions. The Scorch Nomads scavenge pre-war technology and resources from the Scorch, trading them with the Verdant Folk for food and other necessities. The Verdant Folk, in turn, trade with the other factions for technology and resources they cannot produce themselves.
  politics: |-
    The Lunar Sovereigns hold the most power, controlling access to moonstones and advanced technology. Their rule is absolute within Nocturnis, but their influence wanes in the outer regions. The Scorch Nomads and Verdant Folk have a tense but mutually beneficial relationship, with the Nomads providing technology and the Verdant Folk providing food and shelter. The Crystal Dwarves maintain a neutral stance, focusing on their mining operations and trade agreements. The primary conflict lies between the Lunar Sovereigns and the other factions, who resent the Sovereigns' control of resources and technology.
  religion: |-
    Religion in this world is varied and often tied to the unique aspects of each faction. The Lunar Sovereigns worship the moon and Nocturna, believing themselves to be chosen by its power. The Scorch Nomads revere the ancient pre-war technology, seeing it as a reminder of a lost golden age. The Verdant Folk practice a form of animism, believing in the spirits of nature and the interconnectedness of all living things. The Crystal Dwarves worship the mountains and the earth, seeing themselves as stewards of its resources. Religious tensions exist, particularly between the Lunar Sovereigns and the other factions, who see the Sovereigns' beliefs as justification for their control and oppression.
  races:
  - name: Crystal Dwarves
    description: |-
      The Crystal Dwarves are a race of short, stout beings who inhabit the Crystal Peaks. They possess crystalline skin that refracts light and a natural affinity for crafting and technology. Their society is clan-based and industrious, with a strong emphasis on craftsmanship and innovation. They are the primary miners of moonstones, which they trade with the Lunar Sovereigns for other resources.
  - name: Lunar Sovereigns
    description: |-
      The Lunar Sovereigns are humans who have adapted to harness Nocturna, granting them enhanced abilities such as night vision and heightened reflexes during nighttime. They are the ruling class of Nocturnis, often possessing pale, almost translucent skin and silver hair due to prolonged exposure to Nocturna. Their society is hierarchical and secretive, with power concentrated among a few families who control access to moonstones and advanced technology.
  - name: Nocturna-Blighted
    monstrous: true
    description: |-
      What is left when somebody stands too long under Nocturna's glow and the disorientation and the memory loss run all the way to the end. A Blighted keeps the shape of a person and the habits of one -- it will still climb a stair it has no reason to climb, still turn a key in a door it does not need opened -- and it keeps nothing else. It cannot be reasoned with, because there is nobody in there to reason with, and it will not be reasoned at: a Blighted goes for anybody still carrying a name. The Sovereigns keep them out of the ledgers and out of the guidebooks and have never once said the word in public, which is why every district has a story about one and no district has a record of one.
  - name: Scorch Nomads
    description: |-
      The Scorch Nomads are a hardy people who have adapted to survive in the harsh landscape of the Scorch. They are a mix of humans and other races who were exiled or fled Nocturnis after the Great War. They possess dark, weathered skin and are known for their resilience and resourcefulness. Their society is tribal and egalitarian, with a deep distrust of technology and the Lunar Sovereigns.
  - name: Verdant Folk
    description: |-
      The Verdant Folk are a race of humanoid plant beings who inhabit the Verdant Expanse. They possess bark-like skin, leaves for hair, and a deep connection to nature. Their society is communal and peaceful, with a strong emphasis on harmony and balance. They possess an innate ability to manipulate plant life, which they use to create their homes and tools.
story:
  title: The Lunar Cartographer
  genre: Fantasy
  start_time: '2026-08-31T23:00:00Z'
  preface: |-
    The apartment smells of boiled cabbage and lamp oil. A fine dust of plaster drifts down from the ceiling where the building groans, settling itself into its new configuration for the night. You sit at the oak table by the window, watching motes swirl in the amber light of your kerosene lamp. Across the scarred wood, a half-finished map of Nocturnis spreads out like a rumor you can't quite believe. The Larkspur Quarter, where you woke this morning, has already migrated two blocks north by your last bearings. The Bell of Saint Aravel chimes once in the distance—11 p.m., or close enough. Outside the open window, the cobblestones of Mournwell Lane breathe with a faint, silvery luminescence, rearranging themselves with the patience of something that has done this for seventy-five years. Your landlord, old Grenn, has left a note under your door demanding the overdue rent by morning, or he'll have your table and your instruments out in the lane by noon. The map is worth more than the rent. Both are due before the city forgets where it put this building.
  summary: |-
    The player is a cartographer hired by the Lunar Sovereigns to map the nightly rearrangements of the city of Nocturnis, where buildings, streets, and landmarks shift with the moon's phases due to residual magical energy called Nocturna. As they work, they uncover conspiracies within the Sovereigns, encounter the displaced peoples of the Scorch Nomads and Verdant Folk, and grapple with the disorienting effects of prolonged exposure to Nocturna, which causes memory loss. The game's tone is grounded, atmospheric, and focused on mystery and survival in a world that refuses to stay still.
opening_scene:
  location: 'Grenn''s Boarding House, Room 3'
  characters: [Isbet Marrow, Grenn Ollivar]
  description: |-
    Your pen stops halfway through a bearing, because there is somebody breathing in the doorway. Old Grenn has come up to the third floor after dark, which in four years he has never once done, and he is holding his ledger flat against his chest like a man who means to read aloud from it. The lamp throws his shadow across the half-finished map, across the two blocks of the Larkspur Quarter you have not been able to make agree since morning. He does not say anything. Neither do you. Plaster ticks down out of the ceiling between you, and below the window Mournwell Lane has already gone silver, and somewhere under the floorboards the building begins, very slightly, to turn.
  summary: |-
    The story opens in Room 3 with Grenn Ollivar standing in the doorway after dark, the rent due by morning, and the city starting to move.
