- name: The Bell of Saint Aravel
  detail_level: realized
  danger: dangerous
  teaser: |-
    Follow the eleven o'clock chime back to the tower that rang it.
  description: |-
    The stair comes out into the bell chamber and stops being a stair, and the whole city is suddenly below you and going quietly sideways. Saint Aravel's bell hangs on a headstock older than the Great War, green-black, big enough to stand inside, and the rope comes down through a hole in the boards and lies coiled on the floor as neatly as anything you have seen in Nocturnis. There is no lamp up here. There does not need to be: the louvres are open on four sides and the Larkspur Quarter is putting out enough silver to read a bearing by.

    The Ringer is standing by the rope with his back to the louvres, and he was standing there before you came up. He is grey the way a photograph is grey, all of him the same shade, and he is far too still for a man waiting for the hour. Nothing in the chamber moves except the bell, very slightly, in the wind off the roofs. The only way down is the stair behind you, and the boards on it creak on the way down exactly as loudly as they creaked on the way up.
  lore: |-
    Saint Aravel's is one of the three fixed points in Nocturnis. The Sovereigns will tell you the tower does not move because it was built on pre-war footings; the Crystal Dwarves will tell you it does not move because there is a seam of unworked moonstone under it and Nocturna will not cross its own supply. Either way, a bearing taken from the bell is the only bearing in this city that means the same thing tomorrow, which is why every cartographer in the quarter eventually climbs it and why the parish gave up charging for the privilege.

    What the parish does not put in the guidebook is what standing in a fixed point does to a person over twenty-nine years, while everything they can see goes past them every night. Marek Sollen rang the hour here from the age of fifteen. The register has him retiring at forty-four, which is the year the entries stop rather than the year anything happened, and it does not say where he went. The bell is still rung on the hour, more or less, and nobody in the Larkspur Quarter has gone up to ask who is ringing it.
