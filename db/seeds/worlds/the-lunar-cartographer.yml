    dexterity: 14
    will: 13
  nickname: Iz
  age: 34
  sex: female
  is_protagonist: true
  is_companion: false
  backstory: |-
    Born in a Scorch caravan that made its living selling bearings and salvaged road-signs to a city which rearranged itself out from under them every night. She walked into Nocturnis at nineteen with a stolen theodolite and a talent nobody in the caravan had a word for: she can look at a street and tell where it has been. The Lunar Sovereigns hired her four years ago to map the nightly rearrangements, pay her badly, and deny in public that the survey exists at all. She has been behind on rent for most of that time.
  personality: |-
    Methodical to the point of rudeness. She would rather finish a bearing than finish a sentence, and she trusts a measurement she took herself over anything a Sovereign puts in writing. Dry, patient, slow to anger, and incapable of forgetting a debt in either direction.
  appearance: |-
    Weathered dark skin, a nomad's squint, and charcoal on the side of every finger. She wears a surveyor's coat cut down from something heavier, its pockets restitched to hold dividers, a lamp-oil bottle and a roll of waxed twine. Her hair is cropped short and going grey at one temple only.
  likes: Fresh bearings, strong tea, the hour before the city moves
  dislikes: Sovereign paperwork, being told a street has always been there
  fears: The memory loss. She has started writing down what she did yesterday.
- fullname: Grenn Ollivar
  race: Lunar Sovereigns
  location: Grenn's Boarding House, Room 3
  stats:
    level: 1
    hit_die: 6
    strength: 9
    dexterity: 7
    will: 12
  nickname: Old Grenn
  age: 61
  sex: male
  is_protagonist: false
  is_companion: false
  backstory: |-
    A Sovereign family's third son, bought out of his inheritance at thirty for a sum that covered exactly one boarding house in the Larkspur Quarter. He has spent the thirty years since laying his foundation stones loose so the building survives the shifting, and reminding anyone who will hold still that he owns it outright. He does not go up to the third floor after dark.
  personality: |-
    Loud, aggrieved, and fundamentally decent under about two inches of grievance. He threatens eviction roughly weekly and has carried one out once in thirty years. He would very much like to be asked about the house.
  appearance: |-
    Heavyset, pale even for a Sovereign, silver hair gone thin on top, and a cough he blames on the plaster dust. He carries a ledger under one arm at all hours, including the hours when nobody is awake to owe him anything.
  likes: His own foundations, being right about the plaster, a settled ledger
  dislikes: The Sovereign's Circle, tenants who talk to the walls
  fears: That the house will crack after all, and that his family was right
- fullname: Marek Sollen
  race: Nocturna-Blighted
  location: The Bell of Saint Aravel
  hostile: true
  stats:
    level: 1
    hit_die: 10
    strength: 14
    dexterity: 8
    will: 3
  nickname: the Ringer
  age: 44
  sex: male
  is_protagonist: false
  is_companion: false
  backstory: |-
    He rang the eleven o'clock for twenty-nine years, which meant twenty-nine years of standing in the one tower the city cannot move while the rest of it went past underneath him. Nobody told him what that does. The parish stopped seeing him some while before it stopped hearing him, and by then he had already forgotten his sister's name, then his own, then what the rope was for -- though he still pulls it, on the hour, more or less.
  personality: |-
    Nothing decides anything up there any more. What is left is habit and a terrible steadiness: he climbs, he waits, he pulls, and anything in the chamber that still answers to a name is something he goes for without hurrying and without stopping.
  appearance: |-
    A big man gone grey all the way through, skin and coat and eyes the same lamp-lit nothing, standing straighter than a living man stands. His hands are still a ringer's hands. He does not blink and he does not look away.
  likes: The hour. The rope. The weight coming back up the line
  dislikes: Anything that says a name out loud in his tower
  fears: Nothing at all, and that is the whole of what is wrong with him
