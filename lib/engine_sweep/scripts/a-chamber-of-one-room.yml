# AN EXIT PICKED `inside: one room` IS THE ROOM IT NAMES.
#
# The shaft's exits answer names "Core Access Chamber" and picks one room for
# its inside. That pick used to give the chamber a footprint, so the first
# entry laid it out as a building holding a single room that filled it, moved
# the doorway onto that room, and stood the player in "Core Access Chamber
# room 1" -- a name nobody chose, which `Location::RoomName` then rightly would
# not replace with the chamber's own. See `Location::Parameters::ONE_ROOM`.
#
# So after the move the player typed, the party stands in the chamber under its
# own name, the chamber is realized with ONE location reply (a building would
# have needed two), no placeholder room is anywhere a player can walk, and the
# ladder back down lands on the shaft and back up lands on the chamber again.
story: A Chamber of One Room
steps:
- id: up-into-the-shaft
  type: /move Maintenance Shaft
  why: the shaft's exits answer is where the chamber is born, with one room picked
  browser:
    token: into-the-shaft
    realizes: Maintenance Shaft
    replies:
    - purpose: location
      content:
        description: A ladder climbs through ribbed conduit toward the core.
        lore: Engineers use it when the lift is down.
        items: []
        people: []
    - purpose: location
      content:
        exits:
        - name: Cargo Deck
          teaser: Crates in rows.
          distance: adjacent
          travel_method: climbing
        - name: Core Access Chamber
          teaser: A hatch at the top of the ladder.
          distance: adjacent
          travel_method: climbing
          inside: one room
    - purpose: arrival
      unavailable: true
  expect:
    location: Maintenance Shaft (realized)
    exits: [Cargo Deck (realized), Core Access Chamber (stub)]
- id: up-into-the-chamber
  type: /move Core Access Chamber
  why: the party stands in the chamber by the name the player typed, not in a room of it
  browser:
    token: into-the-chamber
    realizes: Core Access Chamber
    replies:
    - purpose: location
      content:
        description: Frost on the rails and a hum in the floor.
        lore: The core was sealed after the second breach.
        items: []
        people: []
    - purpose: location
      content:
        exits:
        - name: Maintenance Shaft
          teaser: The ladder back down.
          distance: adjacent
          travel_method: climbing
    - purpose: arrival
      unavailable: true
  expect:
    location: Core Access Chamber (realized)
    exits: [Maintenance Shaft (realized)]
    exits_exclude: [Core Access Chamber room 1]
- id: back-down-the-ladder
  type: /move Maintenance Shaft
  why: the return edge is the same doorway, and it still lands on the chamber
  browser: {token: back-down, fail: arrival}
  expect:
    location: Maintenance Shaft (realized)
    exits: [Cargo Deck (realized), Core Access Chamber (realized)]
    exits_exclude: [Core Access Chamber room 1]
- id: and-up-again
  type: /move Core Access Chamber
  browser: {token: up-again, fail: arrival}
  expect:
    location: Core Access Chamber (realized)
    exits: [Maintenance Shaft (realized)]
