# THE LUNAR CARTOGRAPHER, WALKED TO ITS END -- the checked-in world's arc, `The
# Fixed Bearing`: up to the bell, the Ringer's tally, and the climbers' book.
#
# THE TALLY IS IN THE RINGER'S HANDS, so the middle beat is a fight, and it is
# walked the way `a-fight-the-player-wins.yml` walks it: an attack and a `mend`
# per round, ten rounds, because ten blows of at least one cannot leave his ten
# hit points standing whatever the dice said. A round after he is down is
# refused and writes nothing, so the walk is the same walk on every roll.
#
# THE WHOLE ROUTE IS TWO ROOMS UP FROM THE START, and the arc ends in the bell
# chamber: nothing here depends on where the nightly rearrangement puts the
# Larkspur Quarter afterwards.
story: The Lunar Cartographer
why: the checked-in world's arc walked in order, through a fight, to its default ending, and the closing scene carries that ending's words
steps:
- id: nothing-reached-yet
  type: look
  expect:
    location: Grenn's Boarding House, Room 3 (realized)
    ending: none
    ending_words: []

- id: up-the-stairs
  type: go to the hallway
  expect:
    changed: true
    location: Grenn's Boarding House hallway (stub)

- id: the-one-fixed-point
  type: go to the bell
  why: beat 1 -- arriving is free, because a riposte runs in the room the turn began in
  expect:
    changed: true
    location: The Bell of Saint Aravel (realized)
    foes: [Marek Sollen]
    here: [climbers' bearing book]
    quest:
      1: reached
    ending: none

- id: round-1
  type: attack Marek Sollen
  expect:
