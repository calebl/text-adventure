# WHO IS IN THE ROOM, WALKED. The defect this world was the sighting for:
# arriving at The Tide Post recorded the protagonist alone -- on all three runs
# checked -- in a world whose entire premise is that Neb Halloran is chained to
# that post. The narrator put him there, correctly and unfalsifiably, and no
# record kept him.
#
# WHY IT COULD NOT BE SWEPT BEFORE. Who was standing in a room was reconstructed
# from the last scene played there that happened to record a cast, and an
# offline walk writes no scenes at all -- so presence was invisible to this
# sweep by construction, and the only place it could be observed was a generated
# run costing money. `characters.location_id` is a record, so it is now readable
# with no model, and this file is the regression test the defect never had.
#
# EVERY STEP IS A FACT OFF THE PLAYTHROUGH'S CAST, which is the closed set
# `Playthrough::Classifier` resolves a `talk` against and the same one
# `Playthrough::Moment` tells the narrator about. `present` excludes the player
# themselves, exactly as the classifier's cast does -- a player cannot talk to
# themselves.
#
# A LIVING CAST. Seeded people now carry pursuits, so `Playthrough::Volition`
# may walk them between typed lines. This script does not pin a still cast: it
# pins that presence is counted where people actually stand, that Neb at the
# Tide Post remains reachable when the player arrives (he has had no turn of
# his own yet on that arrival), and that a name missing from the room's cast is
# refused against whoever is really there. `cast_unmoved` still holds the
# WORLD layer still; playthrough whereabouts may move.
#
# THE WORLD IS THE HELD-OUT ONE and that is fine here, for the reason
# `the-salt-assizes-grammar.yml` gives: `Eval::HELD_OUT` is about not tuning
# narration checks on prose nobody has read, and this file reads no prose.
story: The Salt Assizes
why: presence as a record -- the Tide Post forgetting Neb Halloran, walked
steps:
- id: the-seeded-cast-before-anybody-acts
  type: stats
  why: an engine read-out evaluates nothing, so the seeded placements are intact
  expect:
    location: The Causeway Court (realized)
    present: [Ammon Brace]
    carrying: [Assize tide-slate]
    volitions: 0
    acts: 0

- id: talk-to-somebody-who-is-not-here
  type: talk to Neb
  why: THE ACCEPTANCE CASE -- refused, and the refusal names the cast that IS here
  expect:
    refused: true
    changed: false
    offers: [there is no person here, Ammon Brace]

- id: talk-to-somebody-who-is
  type: talk to the Justicar
  why: a nickname resolves, the way it does through the classifier's closed enum
  expect:
    understood: talk -> Ammon Brace
    refused: true
    changed: false
    offers: [Ammon Brace is here and the classifier resolved them]

- id: out-to-the-post
  type: go to the Tide Post
  why: THE DEFECT -- arriving must find Neb; a companion from the court may also stand here
  expect:
    changed: true
    location: The Tide Post (realized)

- id: and-he-is-there-to-be-spoken-to
  type: talk to Neb
  why: the whole point of the record -- the premise character resolves on arrival
  expect:
    understood: talk -> Neb Halloran
    refused: true
    changed: false
    offers: [Neb Halloran is here and the classifier resolved them]

- id: a-name-this-room-does-not-hold
  type: talk to Perrin Lasco
  why: a name from another world misses against whoever actually stands here
  expect:
    refused: true
    changed: false
    offers: [there is no person here]

- id: walking-back-to-the-court
  type: go into the Causeway Court
  why: the player moves; presence is re-read in the room they end in
  expect:
    changed: true
    location: The Causeway Court (realized)

- id: the-vestry-is-its-own-room
  type: go to the Vestry Hulk
  why: a room the file places nobody in -- presence may still name someone who walked in
  expect:
    changed: true
    location: The Vestry Hulk (stub)

- id: talk-names-whoever-stands-here
  type: talk
  why: an empty cast and a occupied one refuse differently; both are presence as a record
  expect:
    refused: true
    changed: false
    offers: [talk to whom]

- id: neb-is-not-reachable-from-here
  type: talk to Neb
  why: the premise character is not reachable from a room he is not in
  expect:
    refused: true
    changed: false
    offers: [there is no person here]
