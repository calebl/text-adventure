- id: the-tally-last
  type: take the tally
  why: |-
    THE REGRESSION. Out of order, and nobody was standing over the rope: the
    default ending and its own words, and not `taken-under-his-hands`.
  expect:
    changed: true
    carrying: [climbers' bearing book, bell-rope tally]
    quest:
      1: reached
      2: reached
      3: reached
    ending: the-bearing-holds
    ending_words: ["the survey has its fixed point at last"]
    dead: true
