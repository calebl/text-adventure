- id: the-book-off-the-boards
  type: take the bearing book
  why: beat 3 BEFORE beat 2, with the Ringer dead on the boards -- the order the owner took them in
  expect:
    changed: true
    carrying: [climbers' bearing book]
    quest:
      1: reached
      2: bound
      3: reached
