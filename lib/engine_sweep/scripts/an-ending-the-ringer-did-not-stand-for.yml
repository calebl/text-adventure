# THE GAME THE OWNER PLAYED, AND THE ENDING IT SHOULD HAVE HAD.
#
# The Lunar Cartographer's second ending, `taken-under-his-hands`, says *"You
# took the bearing while the Ringer was still standing over the rope"*. For its
# first month the world file selected it with `when: out_of_order`, and the
# order of beats 2 and 3 cannot say that: the tally is only ever had off
# Marek's body, so a player who killed him, took the bearing book and then the
# tally reached beat 3 before beat 2 with the Ringer long dead -- and was told
# he had been standing over them, in a closing paragraph that made no sense of
# the game they had just played.
#
# THIS IS THAT GAME, line for line in what it did: up to the bell, the fight to
# the death (walked the way `the-lunar-cartographer-to-an-ending.yml` walks it,
# so the same on every roll), the book, and the tally last. The rule is
# `while_alive` now -- the book taken while Marek Sollen was alive
# (`Quest::Outcome::CONDITIONS`) -- so this falls through to the default, whose
# words are the ones this game earned: the tally and the book in the satchel.
#
# `an-ending-taken-under-his-hands.yml` is the other half: the book taken with
# him standing there, which is the only game the second ending is about.
story: The Lunar Cartographer
why: beats taken out of order after the Ringer is dead reach the default ending, because the second one is about him being alive
steps:
- id: nothing-reached-yet
  type: look
  expect:
    location: Grenn's Boarding House, Room 3 (realized)
    ending: none

- id: up-the-stairs
  type: go to the hallway
  expect:
    changed: true
    location: Grenn's Boarding House hallway (stub)

- id: the-one-fixed-point
  type: go to the bell
