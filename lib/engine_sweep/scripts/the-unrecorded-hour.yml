# THE WALK THROUGH "The Unrecorded Hour" -- the world with things on the floor,
# so it is the one that carries the item half of the engine.
#
# WHAT IT IS FOR, in order: standing somewhere and reading the records back,
# picking a thing up, carrying it into another room, putting it down THERE,
# picking up something else, walking into a room nobody has written, and being
# refused four different ways. Every one of those is a different write in
# `Playthrough::Turn`, and between them they are the whole of what the engine
# does without a model.
#
# AND THE ONE THING IN IT THAT IS WRITTEN ON PAPER. Two of this world's items
# are readable and their words are in the seed file, so this is where a read is
# swept: out of the hands, off the floor, twice over on one item, and refused on
# a ward stamp that has nothing written on it. `Item::Inscriber` is never
# reached -- every readable thing here arrives with its words -- which is what
# makes the whole read path assertable with no model in the process at all.
#
# A NOTE ON THE STUB. Walking into The Long Hallway offline moves the player and
# leaves the room unwritten, because there is nothing here to write it with:
# realizing a room is `Location::Generator`, which is two model calls. So the
# expectation is the stub, said out loud -- and `nothing_was_written` asserts it
# again over the whole world after the walk. What the sweep can therefore not
# check is what the generator writes; that is `Location::GeneratorTest`'s.
#
# A LIVING CAST. Seeded people now carry pursuits, so after a drop or a
# move somebody else may claim what was on the floor. This walk pins the
# player's own transfers and refusals; it does not require the floor to
# stay still between typed lines.
story: The Unrecorded Hour
why: the item half of the engine, and the four ways a line can be refused
steps:
- id: the-records-as-seeded
  type: stats
  why: the starting state before anybody acts, so a failure later has a known beginning
  expect:
    location: Ward Office 12 (realized)
    exits: [The Supply Closet (realized), The Long Hallway (stub)]
    here: [ward stamp, filing press]
    carrying: [Ward Office 12 daybook]
    # Rowe is in this room because `characters[].location` says so, not because
    # a scene once recorded him -- an offline walk writes no scenes at all.
    # Perrin Lasco is nowhere on purpose (this world is about him having been
    # removed from it), so he is in no room's `present` anywhere in this file.
    present: [Halkett Rowe]
    volitions: 0
    acts: 0
    changed: false
    refused: false

- id: take-with-an-article
  type: take the ward stamp
  why: an app-owned transfer -- the row moves off the floor and into the hands
  expect:
    changed: true
    understood: take -> ward stamp
    carrying: [Ward Office 12 daybook, ward stamp]
    drifts: 0

- id: read-the-daybook-in-hand
  type: read the daybook
  why: |-
    WHAT IS WRITTEN ON A THING IS A RECORD, so it reads out with no model at
    all -- and it reads out of the player's OWN HANDS, which is the half of the
    closed set a `take` never touches. The text is the seed file's, word for
    word: nothing in this walk could have written it and nothing in this walk
    can change it.
  expect:
    changed: false
    refused: false
    understood: examine -> Ward Office 12 daybook
    note: ["reads: Ward Office 12 daybook", "Query 1188 (Marchmain acre 7) still open"]
    inscription:
      Ward Office 12 daybook: "3.40 — Levee boundary, Marchmain acre 7."
    carrying: [Ward Office 12 daybook, ward stamp]

- id: nothing-is-written-on-a-stamp
  type: read the ward stamp
  why: |-
    The gate is `Item#readable` and it is the whole gate. A stamp has no writing
    on it, so there is nothing to read and nothing is ever generated for it --
    refused, and the refusal says which of the two facts it is.
  expect:
    refused: true
    changed: false
    offers: [there is nothing written on the ward stamp]
    inscription:
      ward stamp: false

- id: carry-it-next-door
  type: go to the Supply Closet
  why: a move into a room that IS written; what is carried comes along
  expect:
    changed: true
    location: The Supply Closet (realized)
    exits: [Ward Office 12 (realized)]
    carrying: [Ward Office 12 daybook, ward stamp]

- id: secure-the-apron
  type: take the apron
  why: get the loose floor items into hand before a pursuing cast can claim them
  expect:
    changed: true
    understood: take -> copy-room apron
    carrying: [Ward Office 12 daybook, ward stamp, copy-room apron]

- id: drop-it-somewhere-else
  type: drop the ward stamp
  why: the drop lands in the room the player is standing in, not the one it came from.
    A pursuing cast may pick the stamp up on the same turn.
  expect:
    changed: true
    understood: drop -> ward stamp
    carrying: [Ward Office 12 daybook, copy-room apron]

- id: take-something-by-a-fragment
  type: take the apron
  why: already holding it -- refused against the floor, and the fragment still resolves the name
  expect:
    refused: true
    changed: false
    offers: [there is no thing lying here]
    carrying: [Ward Office 12 daybook, copy-room apron]

- id: read-what-is-in-hand
  type: read the daybook
  why: |-
    Reading out of the hands -- the half a living cast cannot empty by taking
    from the floor. The text is the seed file's, word for word.
  expect:
    changed: false
    refused: false
    understood: examine -> Ward Office 12 daybook
    note: ["reads: Ward Office 12 daybook"]
    inscription:
      Ward Office 12 daybook: "3.40 — Levee boundary, Marchmain acre 7."
    carrying: [Ward Office 12 daybook, copy-room apron]

- id: read-it-again-and-it-says-the-same-thing
  type: x the daybook
  why: |-
    THE WHOLE POINT, in one step. The words came out of the records the first
    time, so the second reading is the same string and not another guess at it.
  expect:
    changed: false
    refused: false
    understood: examine -> Ward Office 12 daybook
    inscription:
      Ward Office 12 daybook: "3.40 — Levee boundary, Marchmain acre 7."

- id: inventory
  type: inventory
  why: reading the hands changes nothing
  expect:
    changed: false
    refused: false
    carrying: [Ward Office 12 daybook, copy-room apron]

- id: back-through-the-door-it-came-in-by
  type: go to Ward Office 12
  why: exits are bidirectional
  expect:
    changed: true
    location: Ward Office 12 (realized)
    carrying: [Ward Office 12 daybook, copy-room apron]

- id: take-what-is-not-here
  type: take the ward stamp
  why: it is real, it is just in the other room -- a refusal, and no write
  expect:
    refused: true
    changed: false
    offers: [there is no thing lying here]
    carrying: [Ward Office 12 daybook, copy-room apron]
    drifts: 0

- id: drop-what-is-not-carried
  type: drop the private index
  why: also real, also elsewhere, and refused against the hands rather than the floor
  expect:
    refused: true
    changed: false
    offers: [there is no thing you are carrying, Ward Office 12 daybook, copy-room apron]

- id: go-somewhere-that-does-not-exist
  type: go to the lighthouse
  why: an unknown exit is refused WITH the ways out that do exist
  expect:
    refused: true
    changed: false
    offers: [there is no way out, The Supply Closet, The Long Hallway]
    location: Ward Office 12 (realized)

- id: leave-the-apron-in-the-office
  type: drop the copy-room apron
  why: the apron ends the walk in a room it did not start in; a pursuing cast may claim it on the same turn
  expect:
    changed: true
    understood: drop -> copy-room apron
    carrying: [Ward Office 12 daybook]

- id: walk-into-the-unwritten-room
  type: go to the Long Hallway
  why: offline a stub is stood in, not written -- so it keeps its one seeded door and furnishes nothing (Item::Registry writes at realization)
  expect:
    changed: true
    change: a stub -- nobody has written this room
    location: The Long Hallway (stub)
    exits: [Ward Office 12 (realized)]
    exits_exclude: [The Supply Closet]
    here: []

- id: nothing-to-pick-up-in-an-unwritten-room
  type: take everything
  why: an empty floor is told apart from a name that missed -- the set is empty, and it says so
  expect:
    refused: true
    changed: false
    offers: [there is no thing lying here]
    here: []
