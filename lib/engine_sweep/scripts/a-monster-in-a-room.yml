# A WORLD CAN CONTAIN AN ENEMY, AND STANDING IN FRONT OF IT COSTS HIT POINTS.
#
# The captain's ruling of 2026-09-04: *"a universe should be able to have
# monsters as well as characters."* This is that ruling as a walk. Marek Sollen
# is `hostile: true` in `the-lunar-cartographer.yml`, of the `monstrous: true`
# race `Nocturna-Blighted`, standing in the one room of that world the file
# marks `danger: dangerous`. The player walks two rooms to him and the records
# say what he is at every step.
#
# WHAT ONLY A WALK CAN SEE HERE, and it is three things:
#
#   THAT `foes:` AND `present:` ARE TWO DIFFERENT ANSWERS. Grenn Ollivar is
#   standing in the opening room and is nobody's enemy; Marek Sollen is standing
#   in the bell chamber and is. A unit test can assert `Playthrough#foes_in`
#   over a fixture. What it cannot assert is that the two closed sets stay apart
#   turn after turn through the same engine a player types into -- that the room
#   with a monster in it still offers him to `talk`, and that the room with a
#   landlord in it offers nobody to fight.
#
#   THAT NO TYPED LINE MAKES ANYBODY HOSTILE.
#   `EngineSweep::Invariants#hostility_unmoved` reads `characters.hostile`,
#   `races.monstrous` and `locations.danger` off the file after this walk, so
#   every step below is that assertion too -- a move, a look, a take, a talk and
#   a stats read each. Hostility is the world's, on exactly the terms a hit die
#   is, and `stat_blocks_unmoved` is the same sentence one column over.
#
#   THAT MEETING A MONSTER COSTS NO MODEL CALL. `EngineSweep` replaces
#   `BaseAgent.new` with something that raises for the length of a run. Walking
#   into a dangerous room, copying its people into this game
#   (`Playthrough::Snapshot`) and reading the whole engine view back is
#   arithmetic over records from end to end.
#
# WHAT CHANGED UNDER IT when a fight learned to resolve, and it is the one thing
# this script has to say twice: A ROUND IS THE TURN. Marek Sollen is hostile and
# alive, so he answers EVERY line the engine plays while the party is standing in
# his tower -- a talk, a look at the ceiling, a walk back down the stair. He does
# not answer a line the engine REFUSED (*"a refused line writes nothing"*), and he
# does not answer one of the engine's own instruments (`stats` is not a turn in
# the fiction). Both are asserted below, because both are decisions.
#
# AND A FIGHT IS ESCAPABLE BY LEAVING THE ROOM -- the captain's call C1 -- with a
# price: the foes in the room you LEFT act before you go. Step 7 is that price,
# and the fight closes with one `Scene` the moment the party is somewhere else.
#
# THE ROOM'S OWN DANGER IS SEEDED RATHER THAN ROLLED HERE. `locations.danger`
# decides which pool a person BORN in a room is drawn from
# (`Character::Registry#slots`), and an offline walk realizes no rooms, so
# nothing in this script can produce a monster. That is the right side of the
# line: the file is the decision for a hand-authored world, `Location::Danger`
# rolls one for a generated one, and neither of them is a typed line.
story: The Lunar Cartographer
why: a world can contain an enemy, the engine shows it standing there, and nothing fights
steps:
- id: nobody-here-means-you-harm
  type: look
  why: the room the game opens in has a person in it and no foes -- the two sets are not the same set
  expect:
    location: Grenn's Boarding House, Room 3 (realized)
    present: [Grenn Ollivar]
    foes: []
    exits:
    - Mournwell Lane (stub)
    - Grenn's Boarding House hallway (stub)
    - Larkspur Quarter rooftops (stub)
    changed: false
    refused: false

- id: up-the-stairs
  type: go to the hallway
  why: a stub between here and the tower, and still nobody hostile in it
  expect:
    changed: true
    location: Grenn's Boarding House hallway (stub)
    present: []
    foes: []
    exits:
    - "Grenn's Boarding House, Room 3 (realized)"
    - The Bell of Saint Aravel (realized)

- id: into-the-bell-chamber
  type: go to The Bell of Saint Aravel
  why: THE WHOLE SLICE -- a room the world file marks dangerous, with one of its monsters standing in it
  expect:
    changed: true
    location: The Bell of Saint Aravel (realized)
    # He is in the room's cast, because a monster is an ordinary person in
    # every respect but one -- `Character.present_in` is the same closed set it
    # was, and `talk` still resolves against it.
    present: [Marek Sollen]
    # AND HE IS A FOE, which is the other answer:
    # `Playthrough#foes_in` is the world's `characters.hostile` narrowed by this
    # game's dead, and nothing here has killed anybody.
    foes: [Marek Sollen]
    # ARRIVING IS FREE. The riposte runs in the room the turn BEGAN in, which
    # was the empty stair -- so walking into a monster's room costs nothing and
    # the next line typed in it costs a round.
    blows: 0
    hp: 18
    # A dead end, and the only way down is the stair you came up.
    exits: [Grenn's Boarding House hallway (stub)]
    here: []
    carrying: []

- id: a-monster-is-still-somebody-you-can-address
  type: talk to Marek Sollen
  why: he resolves out of the room's cast like anybody else; this mode has no prose, so it is refused as prose and not as a stranger
  expect:
    refused: true
    changed: false
    offers: [Marek Sollen]
    location: The Bell of Saint Aravel (realized)
    foes: [Marek Sollen]
    drifts: 0
    # AND THE WORLD ANSWERED ANYWAY. The MODE refused to write prose; the
    # ENGINE played the line (`Playthrough::Classifier::Intent#refused?` is
    # false -- he resolved), so the round happened and he swung. That is the
    # difference the riposte reads, and it is why a fight in the browser and a
    # fight here cannot come apart.
    note: 'answered: Marek Sollen hit Isbet Marrow for'
    # ONE BLOW AND NO MORE: one live foe in the room is one answer a turn.
    # `blows:` is the round structure asserted without asserting a die --
    # `Roll`'s seed is built out of row ids, so what a blow COST is not
    # reproducible across two databases and what a turn DID is.
    blows: 1
    dead: false

- id: the-sheet-the-file-gave-him-is-the-players-own-sheet-unmoved
  type: stats
  why: an engine instrument is not a turn in the fiction, so nobody answers it and the sheet is untouched
  expect:
    abilities:
      strength: 11
      dexterity: 14
      will: 13
    # NOBODY ANSWERED IT: `stats` is one of `Playthrough::Grammar::ENGINE_VIEW`
    # and produces no `Intent`, so the world does not answer it. A round is a
    # turn in the FICTION, and a read-out is not one.
    blows: 0
    foes: [Marek Sollen]
    changed: false
    refused: false

- id: nothing-to-pick-up-off-his-floor
  type: take the rope
  why: a REFUSED line writes nothing, and that includes the blow a foe would have thrown
  expect:
    refused: true
    changed: false
    offers: [there is no thing lying here]
    foes: [Marek Sollen]
    drifts: 0
    # AND NOBODY ANSWERED IT EITHER. The reach resolved to nothing, the engine
    # refused the line, and *"a refused line writes nothing"* -- so Marek did
    # not get a round out of it. The captain's ruling of 2026-09-04, read from
    # the other side.
    blows: 0

- id: patched-up-before-turning-her-back
  type: mend 20
  why: his d10 cannot take 18 in one round, so the step below cannot end in a death the script did not mean
  expect:
    hp: 18
    blows: 0
    dead: false

- id: back-down-the-stair
  type: go to the hallway
  why: THE CAPTAIN'S CALL C1 -- a fight is escapable by leaving, and the foes in the room you LEFT act before you go
  expect:
    changed: true
    location: Grenn's Boarding House hallway (stub)
    foes: []
    # He got his blow in as she turned her back, and then the fight ended --
    # one `Scene`, `resolved_action: attack`, `Scene#engine_authored?` true, so
    # `Story::Audit` and `Eval::Richness` skip it and `rake game:score` prints
    # that it did.
    note: 'the fight is over'
    # HE GOT HIS BLOW IN AS SHE TURNED HER BACK, and then it was over.
    blows: 1
    dead: false

- id: and-the-tower-still-has-him-in-it
  type: go to the bell
  why: a fragment of the name, and the room's cast and its foes are where they were
  expect:
    changed: true
    location: The Bell of Saint Aravel (realized)
    present: [Marek Sollen]
    foes: [Marek Sollen]
    # ARRIVING IS FREE, so nobody answered this line either.
    blows: 0
    dead: false
    # AND HE IS UNTOUCHED: nothing in this walk swung back at him, so his hit
    # points are the file's arithmetic and not a die's. `hp_of:` is `hp:`'s
    # counterpart for the room, off `Playthrough#vitals_for` and never off the
    # printed line.
    hp_of:
      Marek Sollen: 10
