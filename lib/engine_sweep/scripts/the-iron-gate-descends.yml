# THE FIRST OFFLINE TEST ANY GENERATED WORLD HAS EVER HAD. The other scripts
# here walk worlds that were authored or hand-finished; this one walks a world
# `rake game:new` wrote, exported with `rake 'game:export[7]'` and repaired by
# hand -- so what it defends is not only an engine path but the world file
# itself, which is the only copy of that world anybody can reload.
#
# WHAT WAS WRONG WITH IT, and why the walk ends where it does. The story's
# preface, its summary and its universe all turn on a captured prince held by
# the Blackfang clan, and the prince existed in prose and in no row at all: the
# only part of him the engine ever held was his signet ring, in the mud of the
# opening room. Meanwhile the dungeon's deepest room was written with two exits
# and both of them led back up, so the world's one remaining frontier was the
# surface and the story could not be finished from inside its own records.
#
# THE REPAIR IS A PLACE WITH AN INSIDE, on the captain's word of 2026-09-07:
# the prince is in a ROOM INSIDE a location, not in a location of his own. So
# this walk is also the second script that walks a laid-out interior, and the
# first that walks one to find somebody in it -- in off the tunnel through the
# spare exit `Location::Interior` keeps on the entry room, two doors deep to
# the room furthest from the way in, and the prince standing there.
#
# IT ASSERTS THE BEAT AND THE PRESENCE, AND NEVER THE PROSE. Where the party
# stands, what leads out of there and who is standing in it are records. The
# cell's NAME and its description are the seed file's own words and nothing in
# this walk could have written either: realizing a room is `Location::Generator`,
# which is model calls, and a sweep makes none -- which is why the rooms it
# passes through on the way stay stubs, are expected as stubs, and are still
# called the numbers `Location::Interior` gave them. The cell is not, and the
# two steps that name it as an exit are what say so.
#
# THE INTERIOR'S OWN GEOMETRY is asserted by `EngineSweep::Invariants` over the
# whole walk rather than step by step here: `geometry_unmoved` says no box and
# no position moved, `positions_in_bounds` says the prince is still on the floor
# of the room he is in, and `exit_cap` says no room gained a way out. This file
# asserts the doors, which is what a player can see.
#
# AND IT IS WHERE THE POPULATION WORD IS HELD TO ACCOUNT. This is the world the
# 2026-09-07 ruling came out of -- it reached a player with one character in it,
# and that character was the player -- so its file is where two rooms carry a
# `population` word: `Rust Market` is `a crowd` and `black pines` is `nobody`.
# Neither is read by this walk and neither could be: the word is read when a room
# is REALIZED, which is two model calls a sweep does not have. What every step
# below asserts instead is that a typed line never touches it --
# `EngineSweep::Invariants#hostility_unmoved` reads both words off the file after
# the walk, on exactly the terms it reads `locations.danger`. Without those two
# keys that half of the check would pass by having nothing to compare.
#
# AND SINCE `ta-story-arc` IT WALKS THE ARC TO ITS CONCLUSION, which is the
# whole of what the captain's Q6 asked for: *offline first -- doctor clean and a
# checked-in sweep that walks a generated world to its conclusion.* This is that
# sweep, and the world is the one he actually generated.
#
# THREE BEATS, EACH REACHED BY AN ORDINARY TYPED LINE, and `quest:` says which
# state each one is in after every step. Nothing here writes a beat: the beats
# are `Playthrough::Arc`'s, read off the four record predicates after every line
# the engine played, and what this file asserts is that they landed. The ARC
# ITSELF is asserted unmoved over the whole walk by
# `EngineSweep::Invariants#quest_unmoved` -- a typed line may reach a beat and
# may not write one.
#
# AND THE LAST BEAT ENDS THE GAME WITH WORDS, which is the fourth of his five
# properties and the one nothing could assert before: reaching the cell writes
# the reached outcome, `playthroughs.ended_at` and an engine-authored closing
# `Scene` carrying the sentence this world was built toward. The step after it
# is a line typed into a finished game, which is how the walk says the ending is
# real rather than merely recorded.
#
# WHAT MOVED IN THIS FILE FOR THAT, said plainly: the walk used to end at room 4
# and used to `talk to the prince` from inside the cell. It cannot any more --
# arriving in the cell finishes the story -- so the ring through room 4 happens
# BEFORE the cell instead of after it, and every exit assertion it made is
# unchanged and still here. What is genuinely lost is the old step that pinned
# the prince into the classifier's closed set through a refused `talk`; the
# `present:` assertion on arrival is what says he is reachable now.
#
# THE WORLD IS ONE OF THE SWEEP'S OWN (`EngineSweep::WORLDS`) rather than a
# world a fresh clone plays, and its header says why.
story: The Iron Gate Descends
why: the repaired generated world, walked from its opening room in to the prince and on to the end of its arc
steps:
- id: the-gate-as-the-world-was-generated
  type: look
  why: the opening room, and the ring that was the only row the prince had
  expect:
    location: Iron Gate Chamber (realized)
    exits: [tunnel upward (realized), obsidian maw (realized)]
    here: [iron key, prince's signet ring]
    carrying: []
    present: []
    changed: false
    refused: false
    # EVERY BEAT BOUND AND NONE REACHED, which is what a seeded arc looks like
    # before anybody plays it: the file named three things and this world
    # contains all three, so nothing is waiting to be grown.
    quest:
      1: bound
      2: bound
      3: bound

- id: take-the-proof-he-passed-this-way
  type: take the signet ring
  why: the story's own device, and an app-owned transfer off the floor
  expect:
    changed: true
    understood: take -> prince's signet ring
    here: [iron key]
    carrying: [prince's signet ring]
    drifts: 0
    # THE FIRST BEAT, off `hold_item` -- this game's own copy of the ring is in
    # the party's hands, which is the closed set `drop` resolves against and the
    # one reader the arc comes through.
    quest:
      1: reached
      2: bound

- id: down-into-the-maw
  type: go to the obsidian maw
  why: the way in, which the generated graph did have
  expect:
    changed: true
    location: obsidian maw (realized)
    present: []

- id: the-deepest-room-has-a-way-on-now
  type: go to Blackfang Tunnel
  why: |-
    THE REPAIR, READ OFF THE GRAPH. This room was written with two exits and
    both led back up; the third is the seed file's, and it opens onto a room
    inside a place rather than onto a location of its own.
  expect:
    changed: true
    location: Blackfang Tunnel (realized)
    exits: [tunnel upward (realized), obsidian maw (realized), Blackfang Warren room 1 (stub)]

- id: in-through-the-spare-exit
  type: go to Blackfang Warren room 1
  why: |-
    THE WAY IN TO A PLACE, walked. The party stands in a ROOM and never in the
    place that contains it, and this room is the entry `Location::Interior`
    reserved a slot on -- so its ways out are the tunnel behind and the two
    doors the layout gave it.
  expect:
    changed: true
    location: Blackfang Warren room 1 (stub)
    exits:
    - Blackfang Tunnel (realized)
    - Blackfang Warren room 2 (stub)
    - Blackfang Warren room 4 (stub)
    present: []
    # THE SECOND BEAT, and it is the one that says a place is bound as the PLACE
    # and read as the ROOM: the step names `Blackfang Warren`, the party is
    # standing in room 1, and it landed -- because `Quest::Step#target_room`
    # resolves a container through `Location::Interior.way_in`. Nobody ever
    # stands in a building.
    quest:
      2: reached
      3: bound

# THE OTHER DOOR OUT OF THE ENTRY ROOM, WALKED FIRST. It used to be walked from
# the cell on the way back out; the cell is now where the story ends, so the
# ring is walked before it instead. Every exit it asserted is asserted here.
- id: the-other-door-out-of-the-entry-room
  type: go to Blackfang Warren room 4
  why: |-
    the layout's second door off the entry room, and the room it leads to opens
    onto the cell -- so the interior is walkable in a ring and the prince stays
    where the world put him.
  expect:
    changed: true
    location: Blackfang Warren room 4 (stub)
    exits: [Blackfang Warren room 1 (stub), the dry cell (realized)]
    present: []
    # STANDING NEXT DOOR TO THE CELL IS NOT STANDING IN IT. A `reach_location`
    # beat is the room and nothing else, which is what makes it a record rather
    # than a reading of how close somebody got.
    quest:
      3: bound

- id: back-to-the-entry-room
  type: go to Blackfang Warren room 1
  why: a door is two rows, so the ring is walkable the other way round too
  expect:
    changed: true
    location: Blackfang Warren room 1 (stub)
    refused: false

- id: through-the-guards-room
  type: go to Blackfang Warren room 2
  why: a door of the layout's own backbone, and nobody in it
  expect:
    changed: true
    location: Blackfang Warren room 2 (stub)
    exits: [Blackfang Warren room 1 (stub), the dry cell (realized)]
    present: []

- id: reach-the-prince-and-end-the-story
  type: go to the dry cell
  why: |-
    THE WHOLE STORY -- the last beat, the presence and the ending, off the
    records and with no model in the room. The room furthest from the way in,
    and the only room of this interior the file writes: what the player reads on
    arrival is *"You are in the dry cell of Blackfang Warren"* and then its own
    description. The line typed here is the name the player read as an exit one
    step back, which is the captain's display ruling of 2026-09-06 walked rather
    than asserted.

    AND ARRIVING FINISHES THE ARC. Every beat is reached, so `Playthrough::Arc`
    writes the reached outcome, ends the playthrough and writes one
    engine-authored closing `Scene` carrying the sentence the world was built
    toward. `dead: true` is `playthroughs.ended_at` being set -- the column says
    the game is over and nothing about how, which is why the note is what says
    this one ended in a story rather than in a death.
  expect:
    changed: true
    location: the dry cell (realized)
    exits: [Blackfang Warren room 2 (stub), Blackfang Warren room 4 (stub)]
    present: [Prince Aurel Durn]
    carrying: [prince's signet ring]
    quest:
      1: reached
      2: reached
      3: reached
    dead: true
    note: "the story is over: The prince is found alive in the dry cell"

- id: and-the-story-stays-over
  type: talk to the prince
  why: |-
    A LINE TYPED INTO A FINISHED GAME, which is what makes the ending real
    rather than merely recorded: `Playthrough::Turn#play` refuses every line
    before it costs anything, so the prince is standing right there and the
    engine will not play it. The old walk refused this line too, for the
    OTHER reason -- answering it is a model call -- and the swap is the whole
    difference the arc made to this file.
  expect:
    refused: true
    changed: false
    dead: true
    location: the dry cell (realized)
    present: [Prince Aurel Durn]
