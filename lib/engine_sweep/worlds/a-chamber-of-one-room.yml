# A cargo deck and the stub of a maintenance shaft, and nothing past it. The
# exits answer for the shaft names the chamber at the top of its ladder with
# `inside: one room`, which is the pick that used to split a chamber into a
# building of one room called "Core Access Chamber room 1". The chamber is not
# in this file on purpose: it has to be born from that answer.
