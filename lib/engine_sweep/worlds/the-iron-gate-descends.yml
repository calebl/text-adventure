- name: Blackfang Warren room 3
  detail_level: realized
  danger: uneasy
  parent: Blackfang Warren
  x: 6
  y: 5
  z: 0
  width: 6
  depth: 4
  teaser: A room inside Blackfang Warren, 6 by 4 paces on storey 0.
  description: |-
    The warren's far corner, 6 by 4 paces of dry obsidian on storey 0, and the only room down here whose walls have been scraped clear of the fungi — grey patches of bare stone, and just enough of a glow left to see by. A door in the north wall goes back through to the room the guards keep, and the one in the west wall is the way you came; nothing else opens anywhere. The stone is scored with rows of short marks cut by something blunter than a blade, and a chain runs from a ring hammered into the east wall to a shackle lying open on the floor. The floor is dry, which nothing else beneath the Spire is. Against the far wall, where the light gives out, a young man in the rags of Council blue sits with his back to the stone and his hands loose in his lap, watching the doorway as though he has watched it every hour he has been awake.
  lore: |-
    This is where the Blackfang keep what they intend to trade. The clan learned in the War of the Spire that a hostage held in the wet tunnels dies of the damp before any Durnish answer arrives, so this corner of the warren was cut above the seep and floored dry, and the ring in its wall is Durnish iron taken off the gate above. The marks scratched in the stone are days. The shackle is left open because the Silent Maw's priests hold that a thing which has been given a choice and stays has been offered properly, and because nobody has walked this far in uninvited in a hundred years. The Iron Council has been told the price twice — the sacred obsidian, weighed out and returned — and has answered neither time.
