- name: Ashen Spire
  detail_level: realized
  danger: uneasy
  teaser: |-
    The dead volcano looms over the city, its slopes scarred by the Church’s pyres and the iron teeth of the capital’s defenses.
  description: |-
    You stand on the ashen slope of the dead volcano, the air thick with the acrid tang of old smoke and the metallic bite of iron. The ground beneath your boots is a mosaic of blackened stone and rusted pyre remnants, the charred bones of heretics still half-buried in the soot. Above, the Spire’s jagged rim cuts the sky like a broken crown, its edges lined with the iron teeth of the capital’s defenses. The wind carries the distant crackle of flames from the Church’s eternal pyres, and the faint, rhythmic pulse of ley lines hums beneath your feet. The only movement is the slow drift of ash, settling like a shroud over everything.
  lore: |-
    The Ashen Spire is the hollowed heart of a long-dead volcano, repurposed by the Church of the Eternal Pyre as a site for executions and heretical burnings. Its slopes are scarred by centuries of iron forging and ritual fires, the stone itself darkened by the blood and ash of countless victims. The Church’s defenses—iron spikes and barbed wire—bristle along its rim, a warning to any who might defy their rule. Beneath its surface, the ley lines run thick, though tapping them here is forbidden, punishable by the pyre. The Spire overlooks Spire’s Rest, the capital of Durnhold, where the Iron Council rules from the Obsidian Throne.
  items:
  - name: charred amulet
    description: |-
      A small, blackened pendant of twisted iron, its surface pitted and warped by fire. The chain is broken, leaving only a jagged stub.
    properties:
  - name: iron nail
    description: |-
      A single, rusted nail, its head bent and its tip blunt from years of exposure to the elements. It’s cold to the touch, as if it has absorbed the chill of the Spire’s shadow.
