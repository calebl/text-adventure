# THE POTTERY ON MILL LANE: the one world a thing can break in.
#
# Mill Lane, and a pottery off it with four rooms laid out in one box. On
# storey 0, west to east: the kiln yard, the workshop and the showroom. On
# storey 1 the drying loft stands above the workshop. The lane opens onto the
# workshop, which is the middle of the house: a door to the yard, a door to the
# showroom and the stair up to the loft. The loft's window over the yard is a
# pair like every other doorway: the row from the loft into the yard carries
# `hazard: fall`, and the row back up is a `climbing` with no hazard.
#
# EVERY FLOOR SAYS SOMETHING, because the floor is half of whether a thing
# breaks. The workshop is flagstones and the yard is cobbles, both `surface:
# hard`. The showroom is rush matting, `surface: soft`. The loft's boards and
# the lane name no surface, a floor that adds nothing.
#
# AND EVERY FRAGILITY IS CARRIED. Ada Hollin comes in with four things in her
# hands, one of each kind a script needs:
#
#   pewter mug       sturdy, and it never throws a die
#   clay jar         brittle
#   glass float      fragile
#   stoneware crock  brittle, and handy rather than light
#
# The showroom's glazed bowl is the world's own fragile thing on a floor. A
# game breaks its copy of the bowl and never the bowl.
#
# `universe.gravity: ordinary` makes the window a fall. A thing thrown through
# it lands as a thing that fell, which is the largest share a landing adds.
#
# Every room is written, so moving between them asks nobody to write one. The
# lane is the opening, and the first room in the file, because a walk starts in
# the lowest-id written room.
#
# Loaded offline by the sweep. No model call, no API key, no network.
---
format: 2
universe:
  physics: Ordinary physics. What is dropped falls, and what is fired breaks.
  technology: A wheel, a kiln, and a lamp in the loft.
  weapons: Nothing much, unless a crock counts.
  geographies: A mill town on a slow river, with a clay pit upstream.
  civilizations: A market town that buys its pots from one family.
  history: The Hollins have fired the town's crockery for three generations.
  economics: Sold by the piece on market day, and by the crate to the inns.
  politics: The market reeve, who sets the stall rents.
  religion: A saint's day in spring, when nobody works the wheel.
