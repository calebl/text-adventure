# THE WAY IN, WRITTEN BY THE ENGINE -- and that is the whole of what this world
# is for.
#
# `lib/engine_sweep/worlds/the-quay-house.yml` has a building in it and its way
# IN is wired by hand, because until the interior-entry slice nothing in the app
# could attach a place's doorway to a room inside it. This world is the same
# claim with the hand taken out: The Quay opens onto THE LANDING STAIR HOUSE
# ROOM 1, and that edge was written by `Location::Generator#open_the_way_in!` on
# the captain's Call 5 of 2026-09-07 -- the doorway the building arrived with,
# moved onto the room the party actually stands in.
#
# HOW IT WAS MADE, so it can be made again: The Quay House loaded under this
# title with its two hand-wired buildings deleted, then one stub created through
# `Location::Generator.create_stub!`, given a 13 by 9 footprint, joined to The
# Quay by an ordinary pair of connection rows, and handed to
# `Location::Generator#lay_out_interior!`. No model call at any point -- a
# layout is integers and one seeded `Roll` -- and `rake game:export` wrote what
# came out. `Story::Doctor` reported nothing.
#
# IT IS AN AUTHORED ARTIFACT FROM HERE ON, like every other exported world: the
# layout is keyed on the story's own id, so re-running the recipe on a different
# database writes a DIFFERENT building. What is checked in is one building the
# engine really wrote, and `lib/engine_sweep/scripts/walking-in-off-the-quay.yml`
# is what walks it.
#
# THE ROOMS ARE STUBS AND STAY STUBS, which is what an interior is until
# somebody walks in and a model writes one. A sweep has no model, so the walk
# asserts the RECORDS: the way in, the doors, the stairs, and the way back out.
#
# Loaded offline by the sweep. No model call, no API key, no network.
