# THE QUAY HOUSE -- a world that exists to be WALKED and not to be played, and
# the reason `EngineSweep::WORLDS` is a directory of its own. It is not in
# `db/seeds/worlds`: a fresh clone should not gain a fourth playable world for
# the sake of one offline test, and the captain's fourth ruling of 2026-09-06
# leaves the three checked-in worlds flat.
#
# WHAT IT IS FOR: a sweep script that walks a LAID-OUT INTERIOR. Nothing else in
# the repository has one to walk. A sweep never realizes a room -- there is no
# model -- so it can never watch `Location::Interior` lay a building out; what
# it can do is walk a building that has already been laid out, which is what
# this file carries.
#
# THE INTERIOR IS THE GENERATOR'S OWN OUTPUT, not a floor plan somebody drew to
# look like one. The Custom House was handed to `Location::Interior.lay_out!`
# and the story was exported with `WorldSeed::Exporter`, so every box, every
# door and every flight of stairs below is what the engine wrote: two storeys
# tiling one 14 x 10 footprint, a serpentine of doors through each, and one
# stairwell where room 1 and room 5 stand over each other.
#
# WHAT IS HAND-WRITTEN, and it is only what the layout deliberately does not do:
# THE WAY IN. `The Quay` is outside all of it and opens onto room 1, which is
# the spare exit `Location::Interior` keeps on the entry room -- so this file is
# also the worked example of what that reserved slot is for.
#
# AND ONE THING LYING SOMEWHERE IN PARTICULAR, which is slice 4 and is why this
# world has an item at all. The seal ledger lies at 6,2 of room 1 -- so
# `EngineSweep::Invariants#positions_in_bounds` has something to be true OF, and
# `things-land-somewhere-in-a-room.yml` is the walk that carries it upstairs and
# puts it down.
#
# `x: 6` IS CHOSEN AND IS NOT AN ARBITRARY CORNER. Room 1 runs 0..6 along x and
# room 5 -- the room above it, and the room the walk drops the ledger in -- runs
# only 0..5, so 6 is a cell of the floor the ledger starts on and of no cell of
# the floor it ends on. `Location::Box#contains?` IGNORES `z` by design (a
# storey belongs to the room, `Location::Spot`), so a cell the two rooms shared
# would be in bounds for both and a drop that kept the ledger's old numbers
# would pass the invariant. At 6,2 it cannot: a stale cell is through the wall
# of room 5 and the walk fails.
#
# WHAT EVEN THIS CANNOT CATCH, said out loud because the invariant looks
# stronger than it is: a drop that wrote NO position at all. `#carry!` has
# already cleared the columns, so such a row ends unplaced, drops out of
# `Item.positioned`, and there is nothing for `positions_in_bounds` to be true
# or false of. `Playthrough::TurnPositionTest` is what asserts a drop writes a
# cell; a walk asserts it is the right one.
#
# It is hand-written for the same reason the way in is: an offline sweep
# realizes no room, so nothing here can watch `Item::Registry` place one.
#
# THE ROOMS ARE STUBS AND STAY STUBS -- an offline walk writes nothing, which is
# `EngineSweep::Invariants#nothing_was_written` -- WITH TWO EXCEPTIONS, and they
# are the state slice 3 produces: rooms 3 and 4 are WRITTEN. A sweep has no
# model, so it can never watch a room being realized; what it can do is walk a
# building in which some rooms already have been, which is what those two are
# for. `Location::Generator#write_exits!` asks a model for no way out of a room
# inside a place, so a written room must still have exactly the doors the layout
# gave it -- and the script walks in to say so.
#
# AND THE TWO WRITTEN ROOMS KEEP THEIR PLACEHOLDER NAMES ON PURPOSE. A room is
# named by the call that writes it (`Location::RoomName`, out of
# `Location::DetailSchema`'s `name`), and a room written by hand in a world file
# never makes that call: a seed file's room name is the file's, exactly as its
# description is. Naming them here would also move `Eval::Realization`'s corpus
# -- three of its cases stand on these rooms BY NAME, and its digest is what
# makes a before/after comparison pairable at all.
#
# THEIR PROSE IS HAND-WRITTEN, being the one thing here no model could supply,
# and it is written the way `Location::Plan` states the facts to a model that
# does: 7 by 6 paces, storey 0, and doors in the walls the boxes really share.
# It is a worked example of a description that agrees with its own floor plan --
# and both rooms are prose `Story::Audit::Prose`'s geometry grammars read that
# the engine did not write itself, which is why that module's `Size` header names
# them. The measurement over every world file's room prose lives there and is not
# repeated here.
#
# AND THERE IS A SECOND BUILDING ON THE QUAY, THE BONDED CELLAR, which is here
# for one reason: it has a storey BELOW the way in. The Custom House goes up and
# nothing in the repository went down, because `Location::Interior` numbered its
# storeys upward from 0 and every place's deepest floor came out above its own
# front door. The cellar is the worked example of that being fixed -- rooms on
# storeys -1, 0 and 1, so one place spans both directions from its entry and the
# stairs bind each pair of adjacent floors.
#
# ITS INTERIOR IS THE GENERATOR'S OWN OUTPUT TOO, on The Custom House's terms
# exactly: the place was handed to `Location::Interior.lay_out!` with `below: 1`
# and the story was exported, so every box and every door below is what the
# engine wrote from one seeded `Roll`. `below:` is the only thing the call said
# and the footprint is the only geometry this file decided -- a world supplies
# parameters and never behaviour, and `Location::Interior::BASEMENTS` is where
# the parameter will come from once `ta-interior-entry` supplies it. A GENERATED
# place still gets no basement, which is why every other world in the repository
# lays out exactly as it did before.
#
# ROOM 2 STANDS AT `Location::ExitsSchema::MAX_EXITS` and room 1 does not, which
# is worth reading rather than counting twice: the entry room keeps a slot free
# for the way IN (`Location::Interior`'s reserved slot, the same one The Custom
# House's entry keeps), so `The Quay` opens onto room 1 and room 1 alone. Room 2
# is where three of the four stairwells land, and having no way in to attach it
# is allowed to spend the lot.
#
# NOTHING IN IT IS WRITTEN AND NOTHING IN IT IS PLACED. Every room is a stub, it
# holds no item and no person, and `a-cellar-below-the-way-in.yml` is the walk
# that goes down the stair and reads the storey off the records. Prose would
# have to be hand-written to agree with boxes that exist only to be descended,
# and there is nothing here for a description to be a worked example OF.
#
# WHAT THE GRAMMARS READ IN THEM IS THE SIZE AND THE STOREY, and not the walls.
# Which wall a door is in is stated to a model and is not checked afterwards --
# `Story::Audit`'s header carries why, and
# `Eval::Realization::UNAVAILABLE_TO_A_REALIZATION` carries the question,
# reported unanswered. So the door sentences here are a worked example of what
# the PROMPT states, and of what the walk asserts about the edges the layout
# gave the room; they are not an example any grammar reads.
---
format: 2
universe:
  physics: Ordinary physics, and a tide that keeps to its table.
  technology: Rope, tar, lamp oil and a ledger.
  weapons: A gaff hook, and whatever is nearest the door.
  geographies: |-
    One quay, one custom house standing on it, and the water at the end of both.
  civilizations: A port that has never been anything else.
  history: Three hundred years of the same tide.
  economics: |-
    Paid in salt weight, settled in coin when the assessor is watching.
  politics: |-
    The harbourmaster, and whoever is owed money by the harbourmaster.
  religion: The tide table, read aloud.
  races:
  - name: Harbourfolk
    description: |-
      Born to the water line, and unimpressed by anybody who was not.
story:
  title: The Quay House
  genre: harbour mystery
  start_time: '2026-09-06T19:00:00Z'
  preface: |-
    The custom house has been locked since noon and the seal on the door is broken.
  summary: |-
    Somebody was inside the custom house when the whole quay says it was empty.
