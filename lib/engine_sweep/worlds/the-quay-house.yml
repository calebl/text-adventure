# THE QUAY HOUSE -- a world that exists to be WALKED and not to be played, and
# the reason `EngineSweep::WORLDS` is a directory of its own. It is not in
# `db/seeds/worlds`: a fresh clone should not gain a fourth playable world for
# the sake of one offline test, and the captain's fourth ruling of 2026-09-06
# leaves the three checked-in worlds flat.
#
# WHAT IT IS FOR: a sweep script that walks a LAID-OUT INTERIOR. Nothing else in
# the repository has one to walk. A sweep never realizes a room -- there is no
# model -- so it can never watch `Location::Interior` lay a building out; what
# it can do is walk a building that has already been laid out, which is what
# this file carries.
#
# THE INTERIOR IS THE GENERATOR'S OWN OUTPUT, not a floor plan somebody drew to
# look like one. The Custom House was handed to `Location::Interior.lay_out!`
# and the story was exported with `WorldSeed::Exporter`, so every box, every
# door and every flight of stairs below is what the engine wrote: two storeys
# tiling one 14 x 10 footprint, a serpentine of doors through each, and one
# stairwell where room 1 and room 5 stand over each other.
#
# WHAT IS HAND-WRITTEN, and it is only what the layout deliberately does not do:
# THE WAY IN. `The Quay` is outside all of it and opens onto room 1, which is
# the spare exit `Location::Interior` keeps on the entry room -- so this file is
# also the worked example of what that reserved slot is for.
#
# AND ONE THING LYING SOMEWHERE IN PARTICULAR, which is slice 4 and is why this
# world has an item at all. The seal ledger lies at 6,2 of room 1 -- so
# `EngineSweep::Invariants#positions_in_bounds` has something to be true OF, and
# `things-land-somewhere-in-a-room.yml` is the walk that carries it upstairs and
# puts it down.
#
# `x: 6` IS CHOSEN AND IS NOT AN ARBITRARY CORNER. Room 1 runs 0..6 along x and
# room 5 -- the room above it, and the room the walk drops the ledger in -- runs
# only 0..5, so 6 is a cell of the floor the ledger starts on and of no cell of
# the floor it ends on. `Location::Box#contains?` IGNORES `z` by design (a
# storey belongs to the room, `Location::Spot`), so a cell the two rooms shared
# would be in bounds for both and a drop that kept the ledger's old numbers
# would pass the invariant. At 6,2 it cannot: a stale cell is through the wall
# of room 5 and the walk fails.
#
# WHAT EVEN THIS CANNOT CATCH, said out loud because the invariant looks
# stronger than it is: a drop that wrote NO position at all. `#carry!` has
# already cleared the columns, so such a row ends unplaced, drops out of
# `Item.positioned`, and there is nothing for `positions_in_bounds` to be true
# or false of. `Playthrough::TurnPositionTest` is what asserts a drop writes a
# cell; a walk asserts it is the right one.
#
# It is hand-written for the same reason the way in is: an offline sweep
# realizes no room, so nothing here can watch `Item::Registry` place one.
#
# THE ROOMS ARE STUBS AND STAY STUBS -- an offline walk writes nothing, which is
# `EngineSweep::Invariants#nothing_was_written` -- WITH TWO EXCEPTIONS, and they
# are the state slice 3 produces: rooms 3 and 4 are WRITTEN. A sweep has no
# model, so it can never watch a room being realized; what it can do is walk a
# building in which some rooms already have been, which is what those two are
# for. `Location::Generator#write_exits!` asks a model for no way out of a room
# inside a place, so a written room must still have exactly the doors the layout
# gave it -- and the script walks in to say so.
#
# THEIR PROSE IS HAND-WRITTEN, being the one thing here no model could supply,
# and it is written the way `Location::Plan` states the facts to a model that
# does: 7 by 6 paces, storey 0, and doors in the walls the boxes really share.
# It is a worked example of a description that agrees with its own floor plan.
