# A WINDOW OVER THE YARD: the one world a fall can be walked in.
#
# A lane, and a farm off it with three rooms laid out in one box: the yard and
# the kitchen side by side on storey 0, and the loft on storey 1 above the
# kitchen. The lane opens onto the yard. The loft
# has two ways down. The stair into the kitchen is an ordinary `taking stairs`
# doorway. The window over the yard is a pair like every other doorway: the
# row from the loft into the yard carries `hazard: fall`, and the row back up
# is a `climbing` with no hazard, so the drop costs and the climb does not.
#
# `universe.gravity: ordinary` is what makes the fall cost anything. A fall of
# one storey at ordinary gravity is two d6 against a dexterity save that halves
# them, so Wenna Halloway (level 3 on a d8, 18 hit points) can never die of
# it, and every walk of this world stays a walk.
#
# Every room is written, so moving between them asks nobody to write one. The
# lane is the opening, and the first room in the file, because a walk starts in
# the lowest-id written room.
#
# Loaded offline by the sweep. No model call, no API key, no network.
---
format: 2
universe:
  physics: Ordinary physics. What falls, falls as hard as it would anywhere.
  technology: Hand tools, a well and a lamp.
  weapons: A pitchfork, and whatever is nearest the door.
  geographies: One farm at the end of a lane, and the fields around it.
  civilizations: A farming parish that keeps to itself.
  history: Four generations of Halloways have worked the same ground.
  economics: Paid at market in coin, and in kind the rest of the year.
  politics: The parish council, which is mostly Halloways.
  religion: A harvest service, and nothing much in between.
  races:
  - name: Parishfolk
    description: |-
      Born within sight of the church tower, and likely to die there.
  gravity: ordinary
