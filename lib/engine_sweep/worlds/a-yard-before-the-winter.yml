quests:
- title: The Salt Road
  premise: Reopen the salt road before the first snow.
  status: open
  contributes: true
  steps:
  - summary: Win over Warden Hesk, who keeps the road shut.
    trigger: speak_to
    target: Warden Hesk
    teaser: A broad woman with the warden's chain about her neck.
  - summary: Find the Salt Stair down to the old road.
    trigger: reach_location
    target: the Salt Stair
    teaser: A stair cut down through the salt to the old road.
  - summary: Take up the iron seal that opens the road gate.
    trigger: hold_item
    target: iron seal
