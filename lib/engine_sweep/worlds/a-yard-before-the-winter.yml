# A world whose arc waits for a place, a person and a thing that no room has
# admitted, and that has already written three rooms: one more and it is past
# its grace (`Quest::Deadline::GRACE_ROOMS`), so the engine stops asking a
# model for what the arc needs and places it itself, one step for each room
# written after that. The yard's four doorways are all spoken for, so what is
# placed hangs off the loft behind the kitchen.
format: 2
universe:
  physics: Ordinary physics.
  technology: Carts, lanterns and iron tools.
  weapons: Cudgels.
  geographies: A farmstead in a salt-marsh valley.
  civilizations: Scattered farms under a warden's charter.
  history: The salt road closed three winters ago.
  economics: Salt is traded for grain.
  politics: The warden's word is law on the marsh.
  religion: The farms keep a harvest feast.
  races:
  - name: Marsh folk
    description: Ordinary people of the salt marsh.
story:
  title: A Yard Before the Winter
  genre: rural mystery
  start_time: '2026-09-12T06:00:00Z'
  preface: The salt road is closed and winter is coming.
  summary: Tamsin must reopen the salt road before the first snow.
