# A stub the player can open, and a room that is ALREADY WRITTEN and that the
# stub cannot reach. That second room is the whole point of this world: the
# exits answer for the workshop names it, and `Location::Generator` must drop
# that one door without failing the realization the entry paid for.
#
# The mill hangs off the market rather than off the workshop, so the door the
# model proposes between the workshop and the mill is an edge that did not
# exist before -- which is the one #connect_exit! refuses for a written room.
