# Exactly two movable doorways exchange their fixed endpoints every hour.
# The rooms remain connected through their mobile bridge. Two hourly moves
# restore the original graph, independently of the world's database id.
format: 2
universe:
  physics: Ordinary physics except that the city's streets move every hour.
  technology: Keys, locks and hand tools.
  weapons: Wooden staves.
  geographies: Two moving workshops between two fixed yards.
  civilizations: A small trading town.
  history: Traders learned to keep their keys through every rearrangement.
  economics: Goods traded for coins.
  politics: A town council keeps the peace.
  religion: The town keeps its own festivals.
  races:
  - name: Townsfolk
    description: Ordinary people of the town.
story:
  title: A Lock in the Moving City
  genre: town adventure
  start_time: '2026-09-10T23:55:00Z'
