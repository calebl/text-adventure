  lore: The toll box has been emptied at dusk every day since the wall was built.
- name: The Back Stair
  detail_level: stub
  population: nobody
  teaser: A narrow stair behind the lodge.
connections:
- between: [The Gate Passage, The Porters' Lodge]
  distance: adjacent
  travel_method: walking
- between: [The Gate Passage, The Toll Booth]
  distance: adjacent
  travel_method: walking
- between: [The Porters' Lodge, The Back Stair]
  distance: adjacent
  travel_method: walking
