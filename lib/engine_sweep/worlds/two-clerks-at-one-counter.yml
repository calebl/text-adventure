# TWO PEOPLE WITH SOMETHING TO SAY, AND NOWHERE FOR EITHER OF THEM TO GO.
#
# Built for speaking up unasked (the engine's speech die, its
# `data/playthrough/volition/speech.yml`): Tamsin wants what the player has
# (`desire_pursuit: obtain`, the row that weighs asking heaviest) and Rowe
# wants to keep the counter to himself (`keep`, the row that weighs a
# dismissal heaviest). Two of them in one room is what the per-turn cap and
# the cooldown need to be seen at all, and a person being spoken to with the
# other standing by is what "the one you address does not interrupt" needs.
#
# ONE ROOM AND A STREET NOBODY HAS WRITTEN, which is the least a world may have
# and still be one the doctor calls playable. The start time is chosen so both
# of them are still behind the counter on every line a script here plays: the
# act die is seeded off the story's clock, as the speech die is. The player
# carries a pawn ticket from the start and a brass tally lies on the counter,
# so there is a thing to ask for on the first line and a second one once it is
# picked up.
#
# NOBODY HERE IS HOSTILE, and there is no hazard: a foe may only demand or
# dismiss, and a warning needs a hazard, and each of those is its own test.
format: 2
universe:
  physics: Ordinary physics.
  technology: Ledgers, lamps and a brass till.
  weapons: Nothing anybody carries.
  geographies: A pawnbroker's counter.
  civilizations: A town that pawns what it cannot sell.
  history: The shop has changed hands twice and its counter never.
  economics: Pledges, tickets and redemptions.
  politics: The shop answers to the town's licensing clerk.
  religion: The town keeps a quiet calendar.
  races:
  - name: Townsfolk
    description: Ordinary people of the town.
story:
  title: Two Clerks at One Counter
  genre: town adventure
  start_time: '2026-09-24T19:05:00Z'
  preface: Two people are behind the counter and both of them have noticed you.
  summary: Ansel has come to redeem a pledge; Tamsin wants his ticket and Rowe wants him gone.
opening_scene:
  location: The Pawn Counter
  characters: [Ansel Mott, Tamsin Gale, Rowe Harker]
  description: You stand at the pawnbroker's counter with your ticket in hand. Tamsin and Rowe are both behind it.
  summary: Ansel comes to the pawn counter to redeem a pledge.
