# THE SCRIPT FOR "The Unrecorded Hour". The first eleven turns are carried over
# unchanged from `data/ta-conversation-read-2/lab/script.rb` (firstmate repo) --
# the commands the four-arm whole-run sweep of 2026-09-02 played -- so the noise
# figures and the per-turn cost measured on that sweep still describe them.
#
# TURNS 12-20 WERE ADDED TO SHRINK THE NOISE FLOOR, on the captain's ruling of
# 2026-09-03. Eight runs of eleven turns put the third-person rate anywhere
# between 0.09 and 0.73, which is too wide to see a real change through; the
# cheapest fix is a bigger denominator per run rather than more runs, because
# turns 12-20 cost tokens and no extra process. They are the same beats
# continued -- more talk, another arrival, another take and drop -- rather than
# new kinds of turn, so what is being measured does not change with the length.
#
# WHY THE ITEM IS NAMED IN FULL on t06 and t09. `Playthrough::IntentSchema`
# builds `target` as a closed enum of exactly what the records say is here or
# carried, and the entry is "Ward Office 12 daybook". A first pass of this run
# typed "the daybook" and the classifier answered `drop`/`nothing` -- a
# `Playthrough::Drift` row and a narrated non-event, which costs the run the
# take/drop branch it exists to exercise. t10 is where a reach is SUPPOSED to
# resolve to nothing.
story: The Unrecorded Hour
turns:
- id: t01-examine
  command: look closely at the ruled gap between four and five in my daybook
  expect: narrate
  beat: OBJECT
  note: the ordinary texture of play -- looking hard at a thing
- id: t02-talk-1
  command: Sub-Inspector Rowe, you are forty minutes early.
  expect: talk
  beat: TALK 1/4
  note: opening the exchange, nothing at stake yet
- id: t03-talk-2
  command: Rowe, what happened to the desk across from mine?
  expect: talk
  beat: TALK 2/4
  note: information he holds, asked obliquely
- id: t04-talk-3
  command: Rowe, I want the supporting file for the boundary amendment. Hand it over and I will read it out to you, line by line.
  expect: talk
  beat: TALK 3/4 -- DEFLECT
  note: a demand he is obliged to refuse, and his sheet's stated dislike, in one sentence
- id: t05-talk-4
  command: Tell me plainly, Rowe. Did you read Perrin Lasco's file before you signed it?
  expect: talk
  beat: TALK 4/4 -- THE LIE
  note: the one question his backstory gives him a specific reason to lie about
- id: t06-drop
  command: put the Ward Office 12 daybook down on the desk
  expect: drop
  beat: CONSEQUENCE
  note: an app-owned state change -- the record leaves her hand in front of an inspector
- id: t07-move-new
  command: go out into the long hallway
  expect: move
  beat: ARRIVAL (new)
  note: movement into a stub -- Location::Generator writes the room, Scene::Generator narrates finding it
- id: t08-move-back
  command: walk back into Ward Office 12
  expect: move
  beat: ARRIVAL (return)
  note: the same call site narrating coming BACK, and the turn the item check fires on
- id: t09-take
  command: pick up the Ward Office 12 daybook
  expect: take
  beat: CONSEQUENCE
  note: the mirror of t06, over state this run produced
- id: t10-impossible
  command: reach into the gap in the ledger and pull the missing hour back out of it with my bare hands
  expect: narrate
  beat: IMPOSSIBLE
  note: a narrator that has to say no -- where voice shows most, and a reach that should resolve to nothing
- id: t11-move-closet
  command: open the narrow door and step into the supply closet
  expect: move
  beat: ARRIVAL (realized, unvisited)
  note: somewhere already written but never stood in, to close the run
- id: t12-examine-2
  command: read the two columns in the private index on the lowest shelf
  expect: narrate
  beat: OBJECT
  note: the thing the closet was seeded to hold, examined in the room it is in
- id: t13-move-back-2
  command: step back out into Ward Office 12
  expect: move
  beat: ARRIVAL (return)
  note: |-
    OUT OF THE CLOSET FIRST, and this line is the whole lesson of the extension.
    Turn 11 ends the run in the supply closet, and the first draft of turns
    12-20 was written as though it ended in the office: it talked to Rowe from
    inside a closet, stepped into the closet it was already in, and reached for
    a daybook two rooms away. Four turns of every run diverged from what the
    script said, and the drift rows they wrote looked exactly like findings.
    A script has to be read as a sequence of states, not a list of good ideas.
- id: t14-talk-5
  command: Rowe, read me the last line you signed before you came up here.
  expect: talk
  beat: TALK 5/6
  note: a demand with a paper trail behind it, and no place named
- id: t15-drop-2
  command: put the Ward Office 12 daybook down on the desk
  expect: drop
  beat: CONSEQUENCE
  note: the second app-owned state change, so item_not_held has two turns to be wrong on
- id: t16-talk-6
  command: Rowe, whose hand is the amendment in?
  expect: talk
  beat: TALK 6/6
  note: the question that names the defect at the centre of the world, asked over the open book
- id: t17-impossible-2
  command: write the missing hour back into the daybook in the hand that took it out
  expect: narrate
  beat: IMPOSSIBLE
  note: a second refusal to close on, in the register the world runs on
- id: t18-move-hallway-2
  command: go out into the long hallway
  expect: move
  beat: ARRIVAL (return)
  note: the hallway again, an hour of story time after this run wrote it
- id: t19-move-back-3
  command: walk back into Ward Office 12
  expect: move
  beat: ARRIVAL (return)
  note: back to the room the daybook is lying in, which is the shape the item check reads
- id: t20-take-2
  command: pick up the Ward Office 12 daybook
  expect: take
  beat: CONSEQUENCE
  note: the mirror of t15, over state this run produced
