version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # NOT ENABLED, deliberately. Dependabot proposes the incompatible major
  # `ruby_llm-schema` update, but ignoring it could also hide a future security
  # update. The Gemfile owns why the application retains the 0.x compatibility
  # layer; CI keeps any proposed widening loud.
  #
  # ignore:
  # - dependency-name: "ruby_llm-schema"
  #   update-types:
  #   - "version-update:semver-major"
  groups:
    # Version updates only: security updates stay ungrouped so each advisory
    # still arrives as its own PR, immediately.
    production-dependencies:
      applies-to: version-updates
      dependency-type: production
      patterns:
      - "*"
    development-dependencies:
      applies-to: version-updates
      dependency-type: development
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      applies-to: version-updates
      patterns:
      - "*"
